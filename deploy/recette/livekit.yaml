# Serveur d'appels de Zandu (LiveKit, docs/exploitation/appels.md). Les clés viennent de
# LIVEKIT_KEYS (fichier .env du serveur), jamais d'ici. Le son passe en direct par les ports UDP
# ci-dessous ; Caddy ne porte que la connexion de contrôle (wss://appel.…).
port: 7880
log_level: info
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Adresse publique du VPS trouvée seule (STUN) : indispensable derrière Docker.
  use_external_ip: true
# Relais pour les téléphones derrière un réseau restrictif (UDP 3478).
turn:
  enabled: true
  udp_port: 3478
  relay_range_start: 40000
  relay_range_end: 40100
room:
  # Salle d'un appel : deux personnes, fermée peu après le départ du dernier.
  max_participants: 2
  empty_timeout: 60
  departure_timeout: 20
