name: APK de recette

# Lancement manuel : onglet Actions → « APK de recette » → Run workflow. Construit l'application
# Android reliée à une recette en ligne, à installer sur les téléphones des testeurs
# (docs/exploitation/mise-en-ligne-recette.md, étape 7). Sans compte Expo.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Adresse de l'API de recette (ex. https://api.recette.zandu.cg) ; vide si serveur à saisir"
        required: false
        default: ''
      site_url:
        description: 'Adresse du site de recette (ex. https://recette.zandu.cg) ; vide si serveur à saisir'
        required: false
        default: ''
      serveur_a_saisir:
        description: "APK de test : l'adresse du serveur se saisit dans l'application (docs/exploitation/apk-de-test.md)"
        type: boolean
        default: false
      demo:
        description: 'Démonstration sans serveur, données fictives (docs/exploitation/demo-locale.md)'
        type: boolean
        default: false
      eas_project_id:
        description: 'Notifications : identifiant du projet Expo (vide = sans notifications)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # Lu aussi par app.config.js au prebuild (HTTP simple autorisé, nom « Zandu (test) »).
      EXPO_PUBLIC_SERVER_PICKER: ${{ inputs.serveur_a_saisir && '1' || '' }}
      EXPO_PUBLIC_DEMO: ${{ inputs.demo && '1' || '' }}
      # Carte Google Maps (docs/exploitation/google-maps.md) ; sans ce secret, carte en tuiles.
      EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
    steps:
      - name: Adresse de l'API ou serveur à saisir
        if: ${{ !inputs.serveur_a_saisir && !inputs.demo && inputs.api_url == '' }}
        run: |
          echo "::error::Indiquez api_url, ou cochez serveur_a_saisir ou demo."
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      # Notifications (ADR-0018) : fichier Firebase depuis le secret GOOGLE_SERVICES_JSON, s'il existe.
      - name: Fichier Firebase des notifications
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/google-services.json
      - name: Projet Android natif (Expo prebuild)
        run: pnpm --filter @zandu/mobile exec expo prebuild --platform android --no-install
      - name: Compilation de l'APK (téléphones ARM 64 et 32 bits)
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          EXPO_PUBLIC_SIMULATOR: '1'
          EXPO_PUBLIC_RECETTE_SMS_URL: ${{ inputs.site_url && format('{0}/recette/sms', inputs.site_url) || '' }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ inputs.eas_project_id }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: zandu-recette-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
