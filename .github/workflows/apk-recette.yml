name: APK de recette

# Lancement manuel : onglet Actions → « APK de recette » → Run workflow. Construit l'application
# Android reliée à une recette en ligne, à installer sur les téléphones des testeurs
# (docs/exploitation/mise-en-ligne-recette.md, étape 7). Sans compte Expo.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Adresse de l'API de recette (ex. https://api.recette.zandu.cg)"
        required: true
      site_url:
        description: 'Adresse du site de recette (ex. https://recette.zandu.cg)'
        required: true
      eas_project_id:
        description: 'Notifications : identifiant du projet Expo (vide = sans notifications)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      # Notifications (ADR-0018) : fichier Firebase depuis le secret GOOGLE_SERVICES_JSON, s'il existe.
      - name: Fichier Firebase des notifications
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/google-services.json
      - name: Projet Android natif (Expo prebuild)
        run: pnpm --filter @zandu/mobile exec expo prebuild --platform android --no-install
      - name: Compilation de l'APK (téléphones ARM 64 et 32 bits)
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          EXPO_PUBLIC_SIMULATOR: '1'
          EXPO_PUBLIC_RECETTE_SMS_URL: ${{ inputs.site_url }}/recette/sms
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ inputs.eas_project_id }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: zandu-recette-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
