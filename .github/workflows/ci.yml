name: CI

# Chaque envoi, sur toute branche : le dépôt n'a pas encore de branche `main` (la branche de
# travail est la branche par défaut), et une branche cassée doit se voir avant toute fusion.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zandu
          POSTGRES_PASSWORD: zandu
          POSTGRES_DB: zandu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zandu" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://zandu:zandu@localhost:5432/zandu_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Tests unitaires (domaine)
        run: pnpm test:unit
      - name: Tests d'intégration (API + PostgreSQL)
        run: pnpm test:integration
      - name: Compilation (paquets, API, site web et back-office Next.js)
        run: pnpm build
      - name: Contrat d'API (OpenAPI)
        run: pnpm lint:openapi
      - name: Client d'API à jour avec le contrat
        run: pnpm --filter @zandu/api-client check-generated
      - name: Variables CSS à jour avec les fondations visuelles
        run: pnpm --filter @zandu/design check-generated
      - name: Application mobile — compilation Android (Metro + Hermes)
        run: pnpm --filter @zandu/mobile exec expo export --platform android --output-dir ${{ runner.temp }}/android-bundle
        env:
          CI: '1'

  # Mise en ligne (ADR-0013) : les trois images se construisent et la recette complète démarre en
  # HTTPS (Caddy, SeaweedFS, PostgreSQL), données de démonstration comprises, puis passe les contrôles
  # de deploy/recette/verifier.mjs.
  recette:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Adresses locales de la recette
        run: echo "127.0.0.1 zandu.localhost api.zandu.localhost bo.zandu.localhost media.zandu.localhost" | sudo tee -a /etc/hosts
      - name: Recette complète en conteneurs
        run: ./deploy/recette/essai-local.sh
      - name: Journaux des services
        if: failure()
        run: ./deploy/recette/essai-local.sh journaux
