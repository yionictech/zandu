openapi: 3.1.0
info:
  title: API Zandu
  version: 0.1.0
  summary: Place de marché Mobile Money — API du MVP
  description: |
    Contrat de l'API backend (`apps/api`). Toutes les routes implémentées ici sont couvertes par des
    tests d'intégration.

    **Conventions**
    - Montants : entiers en francs CFA (`XAF`), jamais de décimales.
    - Téléphones : saisis librement (« 06 612 34 56 »), renvoyés au format E.164 (`+242066123456`).
    - Authentification : `Authorization: Bearer <jeton>` obtenu par OTP.
    - Les créations sensibles exigent l'en-tête `Idempotency-Key` (8 à 128 caractères, unique par
      intention) : renvoyer la même requête avec la même clé renvoie la même ressource, sans doublon.
    - Erreurs : `{ "error": { "code": "…", "message": "…", "details": { … } } }` ; `code` est stable.
    - Personnel (rôles `support`, `admin`) : les routes `/v1/support/*` et `/v1/admin/*` exigent en
      plus un code TOTP validé pour la session (`/v1/auth/mfa/*`), sinon `403 mfa_required`.
      Sessions du personnel : 12 h.

    **Envoi de fichiers** (photos, pièces KYC, preuves) : `POST /v1/uploads` renvoie une URL signée ;
    l'application y dépose le fichier (POST multipart avec `fields` puis `file`, ou PUT du contenu
    brut selon `method`), puis rattache `uploadId` à son usage. L'API ne voit jamais passer les octets.

    **Prévu (non encore exposé)** : messagerie (F13), retrait manuel du solde vendeur, statistiques
    vendeur, gestion des commissions et rapports dans le back-office, recherche d'utilisateurs.
  contact:
    name: Zandu
  license:
    name: Propriétaire — tous droits réservés
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3000
    description: Développement local
security:
  - session: []
tags:
  - name: Authentification
    description: Connexion par code SMS et sessions révocables
  - name: Catalogue
    description: Catégories, recherche, fiches produit, zones de livraison (public)
  - name: Vendeur
    description: Boutique, produits, commandes à traiter, argent du vendeur
  - name: Achat
    description: Panier validé, paiement Mobile Money et suivi du paiement
  - name: Fichiers
    description: Envoi direct des photos et pièces vers le stockage, par URL signée
  - name: Commandes
    description: Suivi, confirmation de réception, litiges (acheteur)
  - name: Livreur
    description: Missions, collecte, remise avec code
  - name: Support
    description: Back-office — vérification, modération, litiges, contrôle comptable
  - name: Rapports
    description: Back-office (administrateurs) — activité, export comptable, règles de commission
  - name: Personnel
    description: >-
      Back-office (administrateurs) — comptes du personnel : ajout, rôle, retrait d'accès,
      déconnexion, second facteur
  - name: Rapprochement
    description: >-
      Back-office (administrateurs) — contrôle quotidien du grand livre contre le relevé de
      l'agrégateur, écarts et régularisations
  - name: Notifications
    description: >-
      Téléphones qui reçoivent les notifications de l'application, accusé de réception (WhatsApp
      puis SMS en secours)
  - name: Webhooks
    description: Notifications signées des agrégateurs
  - name: Système
    description: Santé du service

paths:
  /health:
    get:
      tags: [Système]
      summary: Santé du service (base joignable)
      operationId: health
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

        '429': { $ref: '#/components/responses/Error' }
  /v1/auth/otp/request:
    post:
      tags: [Authentification]
      summary: Envoyer un code de connexion par SMS
      description: |
        Même réponse que le numéro ait un compte ou non. Limites : 1 code / 60 s et 5 / h par numéro,
        30 / h par adresse IP.
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, examples: ['06 612 34 56'] }
      responses:
        '202':
          description: Code envoyé
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, expiresInSeconds, resendAfterSeconds]
                properties:
                  challengeId: { type: string, format: uuid }
                  expiresInSeconds: { type: integer, examples: [300] }
                  resendAfterSeconds: { type: integer, examples: [60] }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1/auth/otp/verify:
    post:
      tags: [Authentification]
      summary: Vérifier le code et ouvrir une session
      description: Crée le compte au premier passage. 5 essais par code.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: '^\d{6}$' }
                deviceLabel: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt, user]
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1/me:
    get:
      tags: [Authentification]
      summary: Utilisateur connecté
      operationId: me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/auth/logout:
    post:
      tags: [Authentification]
      summary: Révoquer la session courante
      operationId: logout
      responses:
        '204': { description: Session révoquée }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/notifications:
    get:
      tags: [Notifications]
      summary: Centre de notifications (50 derniers messages)
      description: >-
        Un message parti par plusieurs canaux (notification, WhatsApp, SMS) n'apparaît qu'une
        fois. Les codes de connexion n'y figurent pas ; le code de remise reste dans le SMS.
      operationId: listNotifications
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, unread]
                properties:
                  unread: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, template, title, body, url, createdAt, unread]
                      properties:
                        id: { type: string, format: uuid }
                        template: { type: string }
                        title: { type: string }
                        body: { type: string }
                        url: { type: [string, 'null'], description: Écran ouvert au toucher }
                        createdAt: { type: string, format: date-time }
                        unread: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/notifications/seen:
    post:
      tags: [Notifications]
      summary: Tout lire
      operationId: markNotificationsSeen
      responses:
        '204': { description: Notifications marquées comme lues }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/deletion:
    get:
      tags: [Authentification]
      summary: Suppression du compte — ce qui l'empêche encore
      description: >-
        Exigence de Google Play et de l'App Store. Impossible tant qu'une commande est en cours,
        qu'un reversement est attendu, ou pour un livreur ou un membre du personnel.
      operationId: accountDeletionStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [possible, blockers]
                properties:
                  possible: { type: boolean }
                  blockers:
                    type: array
                    items:
                      type: object
                      required: [code, message]
                      properties:
                        code:
                          type: string
                          enum:
                            [
                              orders_in_progress,
                              shop_orders_in_progress,
                              seller_balance,
                              payout_pending,
                              rider_account,
                              staff_account,
                            ]
                        message: { type: string }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Authentification]
      summary: Demander la suppression du compte (code par SMS)
      operationId: requestAccountDeletion
      responses:
        '202':
          description: Code envoyé
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, expiresInSeconds]
                properties:
                  challengeId: { type: string, format: uuid }
                  expiresInSeconds: { type: integer }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1/me/deletion/confirm:
    post:
      tags: [Authentification]
      summary: Confirmer la suppression avec le code reçu
      description: >-
        Le compte est fermé, le nom, le téléphone, les adresses et les appareils effacés ; les
        commandes et écritures comptables restent, anonymes (obligation légale).
      operationId: confirmAccountDeletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '204': { description: Compte supprimé }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }

  /v1/me/devices:
    put:
      tags: [Notifications]
      summary: Enregistrer ce téléphone pour les notifications
      description: >-
        Rattaché à la session en cours : une session fermée (déconnexion, accès retiré,
        expiration) ne reçoit plus rien. Un jeton déjà connu change de compte.
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                  maxLength: 200
                  pattern: '^Expo(nent)?PushToken\[[\w-]+\]$'
                  description: Jeton Expo (`ExponentPushToken[…]`)
                platform: { type: string, enum: [android, ios] }
      responses:
        '204': { description: Téléphone enregistré }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/devices/unregister:
    post:
      tags: [Notifications]
      summary: Ne plus recevoir de notifications sur ce téléphone
      description: >-
        Sans session : une déconnexion faite sans réseau est renvoyée au retour du réseau,
        quand la session n'existe plus. Posséder le jeton suffit.
      operationId: unregisterDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 200 }
      responses:
        '204': { description: Téléphone oublié }
        '400': { $ref: '#/components/responses/Error' }

  /v1/me/notifications/{id}/ack:
    post:
      tags: [Notifications]
      summary: Notification reçue ou touchée
      description: >-
        Une notification importante sans accusé ni visite dans l'application est doublée par
        WhatsApp puis SMS après `PUSH_FALLBACK_MINUTES` (15 par défaut).
      operationId: ackNotification
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Accusé enregistré }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/categories:
    get:
      tags: [Catalogue]
      summary: Catégories actives
      operationId: listCategories
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, parentId, slug, name]
                  properties:
                    id: { type: string, format: uuid }
                    parentId: { type: [string, 'null'], format: uuid }
                    slug: { type: string }
                    name: { type: string }

        '429': { $ref: '#/components/responses/Error' }
  /v1/products:
    get:
      tags: [Catalogue]
      summary: Rechercher des produits (F4)
      description: Recherche plein texte en français, insensible aux accents et tolérante aux fautes de frappe.
      operationId: searchProducts
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: categoryId,
            in: query,
            description: Inclut les sous-catégories,
            schema: { type: string, format: uuid },
          }
        - { name: city, in: query, schema: { type: string } }
        - {
            name: verified,
            in: query,
            description: 'Boutiques vérifiées seulement',
            schema: { type: boolean },
          }
        - {
            name: sellerId,
            in: query,
            description: Produits d'une boutique,
            schema: { type: string, format: uuid },
          }
        - { name: minPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 1 } }
        - name: sort
          in: query
          schema:
            { type: string, enum: [relevance, newest, price_asc, price_desc], default: relevance }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 1000, default: 0 },
          }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductCard' }

        '400': { $ref: '#/components/responses/Error' }
  /v1/products/{id}:
    get:
      tags: [Catalogue]
      summary: Fiche produit
      operationId: getProduct
      security: []
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProductCard'
                  - type: object
                    required: [description, media, shareImage, reviews]
                    properties:
                      description: { type: string }
                      media:
                        description: >-
                          Photos dans l'ordre d'affichage, en grande image (800 px au plus, WebP) ;
                          l'original tant que le worker ne les a pas déclinées.
                        type: array
                        items:
                          type: object
                          required: [url]
                          properties:
                            url: { type: string, format: uri }
                            width: { type: [integer, 'null'] }
                            height: { type: [integer, 'null'] }
                      shareImage:
                        description: >-
                          Première photo en JPEG de 1200 px au plus, pour les aperçus de lien
                          (Open Graph : WhatsApp, Facebook).
                        type: [string, 'null']
                        format: uri
                      reviews:
                        type: object
                        required: [average, count]
                        properties:
                          average: { type: [number, 'null'] }
                          count: { type: integer }
        '404': { $ref: '#/components/responses/Error' }

  /v1/shops/{slug}:
    get:
      tags: [Catalogue]
      summary: Vitrine publique d'une boutique (lien partagé sur WhatsApp)
      description: Sans coordonnées du vendeur. Une boutique suspendue est introuvable.
      operationId: getShop
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 60 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    id,
                    shopName,
                    slug,
                    city,
                    verified,
                    ratingAvg,
                    ratingCount,
                    salesCount,
                    memberSince,
                  ]
                properties:
                  id: { type: string, format: uuid }
                  shopName: { type: string }
                  slug: { type: string }
                  city: { type: string }
                  verified: { type: boolean }
                  ratingAvg: { type: [number, 'null'] }
                  ratingCount: { type: integer }
                  salesCount: { type: integer, description: Commandes terminées }
                  memberSince: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Error' }

  /v1/delivery/zones:
    get:
      tags: [Catalogue]
      summary: Zones de livraison et points relais
      operationId: listDeliveryZones
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, city, name, pickupPoints]
                  properties:
                    id: { type: string, format: uuid }
                    city: { type: string }
                    name: { type: string }
                    pickupPoints:
                      type: array
                      items:
                        type: object
                        required: [id, name, landmark]
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                          landmark: { type: string }

        '429': { $ref: '#/components/responses/Error' }
  /v1/seller/shop:
    get:
      tags: [Vendeur]
      summary: Ma boutique
      operationId: getMyShop
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerShop' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Vendeur]
      summary: Ouvrir sa boutique (étape 1 sur 3)
      description: >-
        Nom, ce qui est vendu, lieu de retrait, horaires. Le compte Mobile Money vient à
        l'étape 3 (PATCH) ; par défaut, le numéro du gérant et l'opérateur deviné d'après lui.
      operationId: openShop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopName, city, pickupZoneId]
              properties:
                shopName: { type: string, minLength: 2, maxLength: 80 }
                city: { type: string }
                pickupZoneId: { type: string, format: uuid }
                soldCategoryIds:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
                openingHours:
                  {
                    type: string,
                    minLength: 3,
                    maxLength: 80,
                    examples: [Lun – Sam · 08:00 – 18:00],
                  }
                weeklyHours:
                  description: Horaires jour par jour ; le texte openingHours en est tiré.
                  allOf: [{ $ref: '#/components/schemas/WeeklyHours' }]
                payoutPhone: { type: string }
                payoutOperator: { $ref: '#/components/schemas/Operator' }
                kind: { type: string, enum: [individual, business], default: individual }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Vendeur]
      summary: Modifier ma boutique (congés, préparation, horaires, compte Mobile Money)
      description: >-
        Fermer la boutique (`isOpen: false`) retire ses produits du catalogue et bloque les achats.
        Un numéro de reversement changé après la vérification déclenche le délai de carence des
        reversements.
      operationId: updateMyShop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                shopName: { type: string, minLength: 2, maxLength: 80 }
                city: { type: string }
                pickupZoneId: { type: string, format: uuid, description: Lieu de retrait des colis }
                soldCategoryIds:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
                openingHours: { type: string, minLength: 3, maxLength: 80 }
                weeklyHours:
                  description: Horaires jour par jour ; le texte openingHours en est tiré.
                  allOf: [{ $ref: '#/components/schemas/WeeklyHours' }]
                isOpen: { type: boolean }
                defaultPrepMinutes: { $ref: '#/components/schemas/PrepMinutes' }
                payoutPhone: { type: string, description: Avec payoutOperator }
                payoutOperator: { $ref: '#/components/schemas/Operator' }
                payoutAccountName: { type: string, minLength: 2, maxLength: 80 }
                acceptTerms: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Boutique à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerShop' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/products/{id}/view:
    post:
      tags: [Catalogue]
      summary: Compter une vue de la fiche produit (statistiques du vendeur)
      description: Un compteur par jour, rien sur la personne. Sans effet pour un produit non publié.
      operationId: countProductView
      security: []
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Comptée }
        '400': { $ref: '#/components/responses/Error' }

  /v1/seller/stats:
    get:
      tags: [Vendeur]
      summary: Statistiques de la boutique (vues, ventes, produits phares, réactivité, conseils)
      operationId: sellerStats
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [7d, 30d, 90d], default: 30d }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerStats' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/coupons/{code}:
    get:
      tags: [Achat]
      summary: Vérifier un code promo avant de payer
      operationId: previewCoupon
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Utilisable par moi
          content:
            application/json:
              schema:
                type: object
                required: [code, sellerId, shopName, percent, minSubtotal, endsAt]
                properties:
                  code: { type: string }
                  sellerId: { type: string, format: uuid }
                  shopName: { type: string }
                  percent: { type: integer }
                  minSubtotal: { type: integer }
                  endsAt: { type: [string, 'null'], format: date-time }
        '422': { $ref: '#/components/responses/Error' }

  /v1/seller/coupons:
    get:
      tags: [Vendeur]
      summary: Codes promo de ma boutique
      operationId: sellerCoupons
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          id,
                          code,
                          percent,
                          minSubtotal,
                          maxUses,
                          endsAt,
                          active,
                          createdAt,
                          uses,
                          discountGiven,
                        ]
                      properties:
                        id: { type: string, format: uuid }
                        code: { type: string }
                        percent: { type: integer }
                        minSubtotal: { type: integer }
                        maxUses: { type: [integer, 'null'] }
                        endsAt: { type: [string, 'null'], format: date-time }
                        active: { type: boolean }
                        createdAt: { type: string, format: date-time }
                        uses: { type: integer, description: Commandes payées avec ce code }
                        discountGiven:
                          { type: integer, description: Total des remises accordées (FCFA) }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Vendeur]
      summary: Créer un code promo (remise payée par la boutique)
      operationId: createSellerCoupon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, percent]
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9]{3,20}$' }
                percent: { type: integer, minimum: 5, maximum: 50 }
                minSubtotal: { type: integer, minimum: 0 }
                maxUses: { type: integer, minimum: 1 }
                endsAt: { type: string, format: date-time }
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema:
                type: object
                required: [id, code]
                properties:
                  id: { type: string, format: uuid }
                  code: { type: string }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/seller/coupons/{id}/disable:
    post:
      tags: [Vendeur]
      summary: Arrêter un code promo
      operationId: disableSellerCoupon
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Arrêté }
        '404': { $ref: '#/components/responses/Error' }

  /v1/seller/products/{id}/sale:
    post:
      tags: [Vendeur]
      summary: Mettre un produit en promotion (prix barré)
      description: >-
        Le nouveau prix est calculé sur l'ancien (arrondi à 50 FCFA). Sans date de fin, la
        promotion dure jusqu'à son arrêt ; avec une date, l'ancien prix revient tout seul.
      operationId: startProductSale
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [percent]
              properties:
                percent: { type: integer, minimum: 5, maximum: 70 }
                endsAt: { type: string, format: date-time }
      responses:
        '200':
          description: En promotion
          content:
            application/json:
              schema:
                type: object
                required: [price, compareAtPrice, saleEndsAt]
                properties:
                  price: { type: integer }
                  compareAtPrice: { type: integer }
                  saleEndsAt: { type: [string, 'null'], format: date-time }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Vendeur]
      summary: Arrêter la promotion (l'ancien prix revient)
      operationId: stopProductSale
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Arrêtée }

  /v1/seller/dashboard:
    get:
      tags: [Vendeur]
      summary: Tableau de bord (jour à l'heure de Brazzaville)
      operationId: sellerDashboard
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [todaySales, todayOrders, toAccept, lowStock, productCount]
                properties:
                  todaySales: { $ref: '#/components/schemas/Amount' }
                  todayOrders: { type: integer }
                  toAccept:
                    type: object
                    required: [count, nextDeadline]
                    properties:
                      count: { type: integer }
                      nextDeadline: { type: [string, 'null'], format: date-time }
                  lowStock:
                    type: array
                    items:
                      type: object
                      required: [id, title, stock, lowStockThreshold]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        stock: { type: integer }
                        lowStockThreshold: { type: integer }
                  productCount: { type: integer, description: Produits hors archives }

  /v1/seller/withdrawals:
    get:
      tags: [Vendeur]
      summary: Retrait à la demande — disponible, seuil de contrôle, derniers retraits
      operationId: sellerWithdrawals
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [mode, withdrawable, blockedReason, minimum, reviewAbove, items]
                properties:
                  mode: { type: string, enum: [automatic, on_demand] }
                  withdrawable: { $ref: '#/components/schemas/Amount' }
                  blockedReason:
                    type: [string, 'null']
                    enum: [not_verified, payout_number_cooldown, cap_reached, no_balance, null]
                  minimum: { $ref: '#/components/schemas/Amount' }
                  reviewAbove:
                    {
                      $ref: '#/components/schemas/Amount',
                      description: 'Au-delà : contrôle du back-office',
                    }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, amount, status, createdAt, reviewNote]
                      properties:
                        id: { type: string, format: uuid }
                        amount: { $ref: '#/components/schemas/Amount' }
                        status: { $ref: '#/components/schemas/PayoutStatus' }
                        createdAt: { type: string, format: date-time }
                        reviewNote: { type: [string, 'null'] }
    post:
      tags: [Vendeur]
      summary: Demander un retrait (un code de confirmation part par SMS)
      operationId: requestWithdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, minimum: 1000 }
      responses:
        '202':
          description: Code envoyé par SMS
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, expiresInSeconds]
                properties:
                  challengeId: { type: string, format: uuid }
                  expiresInSeconds: { type: integer }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1/seller/withdrawals/confirm:
    post:
      tags: [Vendeur]
      summary: Confirmer un retrait avec le code SMS
      description: >-
        Le montant est réservé et part vers le compte Mobile Money du vendeur ; au-delà du seuil
        (`reviewAbove`), il attend le contrôle d'un administrateur.
      operationId: confirmWithdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '201':
          description: Retrait enregistré
          content:
            application/json:
              schema:
                type: object
                required: [payoutId, amount, status]
                properties:
                  payoutId: { type: string, format: uuid }
                  amount: { $ref: '#/components/schemas/Amount' }
                  status: { type: string, enum: [pending, awaiting_review] }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }

  /v1/seller/reviews:
    get:
      tags: [Vendeur]
      summary: Avis clients de ma boutique
      operationId: sellerReviews
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [average, count, distribution, items]
                properties:
                  average: { type: [number, 'null'] }
                  count: { type: integer }
                  distribution:
                    type: object
                    required: ['1', '2', '3', '4', '5']
                    additionalProperties: false
                    properties:
                      '1': { type: integer }
                      '2': { type: integer }
                      '3': { type: integer }
                      '4': { type: integer }
                      '5': { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SellerReview' }

  /v1/seller/reviews/{id}/reply:
    post:
      tags: [Vendeur]
      summary: Répondre publiquement à un avis (modifiable)
      operationId: replyToReview
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 2, maxLength: 1000 }
      responses:
        '200':
          description: Réponse publiée
          content:
            application/json:
              schema:
                type: object
                required: [id, reply, repliedAt]
                properties:
                  id: { type: string, format: uuid }
                  reply: { type: string }
                  repliedAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Error' }

  /v1/seller/products:
    get:
      tags: [Vendeur]
      summary: Mes produits (hors archivés, brouillons compris)
      operationId: listMyProducts
      parameters:
        - name: status
          in: query
          description: '`archived` pour lister les produits archivés'
          schema: { type: string, enum: [archived] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          id,
                          title,
                          price,
                          stock,
                          status,
                          categoryId,
                          condition,
                          lowStockThreshold,
                          rejectionReason,
                          updatedAt,
                          coverImage,
                          photoCount,
                        ]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        price: { $ref: '#/components/schemas/Amount' }
                        stock: { type: integer }
                        status: { $ref: '#/components/schemas/ProductStatus' }
                        categoryId: { type: string, format: uuid }
                        condition: { $ref: '#/components/schemas/ProductCondition' }
                        lowStockThreshold: { type: integer }
                        rejectionReason: { type: [string, 'null'] }
                        updatedAt: { type: string, format: date-time }
                        coverImage: { type: [string, 'null'], format: uri }
                        photoCount: { type: integer }
        '409': { $ref: '#/components/responses/Error' }
    post:
      tags: [Vendeur]
      summary: Publier un produit (F3)
      description: >-
        Vendeur vérifié → `published` ; non vérifié → `pending_review` (modération).
        Avec `publish: false`, crée un brouillon (`draft`) : l'application y rattache les photos,
        puis le publie avec `PATCH status=published` (au moins une photo exigée).
        Fiche préparée sans réseau et envoyée plus tard : avec l'en-tête `Idempotency-Key`
        (facultatif ici), un renvoi avec la même clé renvoie le produit déjà créé.
      operationId: createProduct
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId, title, price, stock]
              properties:
                categoryId: { type: string, format: uuid }
                title: { type: string, minLength: 3, maxLength: 140 }
                description: { type: string, maxLength: 5000 }
                price: { $ref: '#/components/schemas/Amount' }
                stock: { type: integer, minimum: 0 }
                condition: { $ref: '#/components/schemas/ProductCondition' }
                lowStockThreshold:
                  {
                    type: integer,
                    minimum: 0,
                    maximum: 1000,
                    default: 2,
                    description: Alerte « Stock bas »,
                  }
                publish: { type: boolean, default: true }
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/ProductStatus' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/seller/balance:
    get:
      tags: [Vendeur]
      summary: Mon argent (F15)
      operationId: sellerBalance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [payoutMode, available, inEscrow, payoutAccount, payouts, movements]
                properties:
                  payoutMode:
                    type: string
                    enum: [automatic, on_demand]
                    description: Reversement automatique, ou retrait à la demande (Paramètres)
                  available:
                    allOf: [{ $ref: '#/components/schemas/Amount' }]
                    description: Libéré, en attente du reversement automatique (plafond nouveau vendeur compris)
                  inEscrow:
                    allOf: [{ $ref: '#/components/schemas/Amount' }]
                    description: >-
                      Part du vendeur (articles − commission) des commandes encore en séquestre :
                      versée après la livraison et la fin du délai de réclamation
                  payouts:
                    type: array
                    items:
                      type: object
                      required: [id, amount, status, orderId, publicRef, createdAt, succeededAt]
                      properties:
                        id: { type: string, format: uuid }
                        amount: { $ref: '#/components/schemas/Amount' }
                        status: { $ref: '#/components/schemas/PayoutStatus' }
                        orderId: { type: [string, 'null'], format: uuid }
                        publicRef: { type: [string, 'null'] }
                        createdAt: { type: string, format: date-time }
                        succeededAt: { type: [string, 'null'], format: date-time }
                  payoutAccount:
                    type: object
                    required: [operator, phone]
                    properties:
                      operator: { $ref: '#/components/schemas/Operator' }
                      phone: { type: string }
                  movements:
                    type: array
                    description: >-
                      Argent bloqué à la commande payée, libéré à la remise confirmée, versé sur
                      Mobile Money ; montants nets de commission, les plus récents d'abord.
                    items:
                      type: object
                      required: [kind, publicRef, amount, at]
                      properties:
                        kind: { type: string, enum: [held, released, paid_out] }
                        publicRef: { type: [string, 'null'] }
                        amount: { $ref: '#/components/schemas/Amount' }
                        at: { type: string, format: date-time }

        '401': { $ref: '#/components/responses/Error' }
  /v1/seller/orders:
    get:
      tags: [Vendeur]
      summary: Commandes de ma boutique
      description: Sans le téléphone ni le repère de l'acheteur (le livreur s'en charge).
      operationId: sellerOrders
      parameters:
        - name: status
          in: query
          description: Un ou plusieurs statuts séparés par des virgules (ex. `paid,preparing`)
          schema: { type: string, examples: ['paid,preparing'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SellerOrder' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/seller/orders/{id}:
    get:
      tags: [Vendeur]
      summary: Détail d'une commande de ma boutique
      operationId: sellerOrder
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SellerOrder'
                  - type: object
                    required: [history, rider, delivery, dispute, reviews]
                    properties:
                      history: { $ref: '#/components/schemas/OrderHistory' }
                      rider:
                        type: [object, 'null']
                        description: Livreur attribué (prénom et initiale)
                        required: [name]
                        properties:
                          name: { type: string, examples: [Junior M.] }
                      delivery:
                        type: [object, 'null']
                        description: >-
                          Où en est le livreur : code de retrait à confirmer (`assigned`), colis
                          à reprendre avec son code de retour (`returning`).
                        required:
                          [status, pickupConfirmedAt, returnConfirmedAt, returnedAt, failureReason]
                        properties:
                          status: { $ref: '#/components/schemas/DeliveryStatus' }
                          pickupConfirmedAt: { type: [string, 'null'], format: date-time }
                          returnConfirmedAt: { type: [string, 'null'], format: date-time }
                          returnedAt: { type: [string, 'null'], format: date-time }
                          failureReason: { type: [string, 'null'] }
                      dispute:
                        oneOf:
                          - type: 'null'
                          - $ref: '#/components/schemas/SellerDispute'
                      reviews:
                        type: array
                        items:
                          type: object
                          required: [id, rating, comment, tags, createdAt, authorName, reply]
                          properties:
                            id: { type: string, format: uuid }
                            rating: { type: integer, minimum: 1, maximum: 5 }
                            comment: { type: [string, 'null'] }
                            tags: { type: array, items: { $ref: '#/components/schemas/ReviewTag' } }
                            createdAt: { type: string, format: date-time }
                            authorName: { type: string }
                            reply: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/Error' }
  /v1/seller/orders/{id}/accept:
    post:
      tags: [Vendeur]
      summary: Accepter une commande payée, en promettant l'heure où elle sera prête
      operationId: acceptOrder
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                readyInMinutes:
                  allOf: [{ $ref: '#/components/schemas/PrepMinutes' }]
                  description: Préparation par défaut de la boutique si absent
      responses:
        '200': { $ref: '#/components/responses/OrderStatusChange' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/seller/orders/{id}/reject:
    post:
      tags: [Vendeur]
      summary: Refuser une commande, ou l'annuler en préparation (rupture de stock) ; l'acheteur est remboursé
      operationId: rejectOrder
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/OrderStatusChange' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/seller/orders/{id}/ready:
    post:
      tags: [Vendeur]
      summary: Colis prêt pour le livreur
      operationId: markOrderReady
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/OrderStatusChange' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/seller/orders/{id}/rider-pickup:
    post:
      tags: [Vendeur]
      summary: Confirmer le code de retrait montré par le livreur
      description: >-
        Le livreur attribué montre un code à 4 chiffres ; le vendeur le saisit avant de donner le
        colis. Sans cette confirmation, le livreur ne peut pas prendre le colis en charge.
      operationId: sellerConfirmRiderPickup
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Code4' }
      responses:
        '200':
          description: Code confirmé
          content:
            application/json:
              schema:
                type: object
                required: [orderId, pickupConfirmedAt]
                properties:
                  orderId: { type: string, format: uuid }
                  pickupConfirmedAt: { type: string, format: date-time }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/seller/orders/{id}/rider-return:
    post:
      tags: [Vendeur]
      summary: Confirmer le code de retour (colis rapporté par le livreur)
      operationId: sellerConfirmRiderReturn
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Code4' }
      responses:
        '200':
          description: Retour confirmé
          content:
            application/json:
              schema:
                type: object
                required: [orderId, returnConfirmedAt]
                properties:
                  orderId: { type: string, format: uuid }
                  returnConfirmedAt: { type: string, format: date-time }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/seller/orders/{id}/dispute-response:
    post:
      tags: [Vendeur]
      summary: Répondre à un litige (lu par le support avant de trancher)
      operationId: respondToDispute
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { $ref: '#/components/schemas/DisputeSellerChoice' }
                message: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Réponse enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerDispute' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/seller/orders/{id}/dispute-evidence:
    post:
      tags: [Vendeur]
      summary: Ajouter une photo à l'appui de sa réponse (6 au plus)
      operationId: addSellerDisputeEvidence
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId]
              properties:
                uploadId: { type: string, format: uuid }
      responses:
        '201':
          description: Ajoutée
          content:
            application/json:
              schema:
                type: object
                required: [orderId]
                properties:
                  orderId: { type: string, format: uuid }
        '409': { $ref: '#/components/responses/Error' }

  /v1/checkouts:
    post:
      tags: [Achat]
      summary: Transformer le panier en commandes (une par vendeur)
      description: Réserve le stock. Le panier expire s'il n'est pas payé (10 min par tentative, 30 min au total).
      operationId: createCheckout
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, delivery]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 100 }
                delivery:
                  type: object
                  required: [mode, zoneId, recipientName, phone, landmark]
                  properties:
                    mode: { type: string, enum: [home, pickup_point] }
                    zoneId: { type: string, format: uuid }
                    pickupPointId: { type: string, format: uuid }
                    recipientName: { type: string }
                    phone: { type: string }
                    landmark:
                      type: string
                      description: Adresse par repères
                      examples: ["Tié-Tié, derrière l'école Saint-Pierre, portail bleu"]
                    location:
                      allOf: [{ $ref: '#/components/schemas/GeoPoint' }]
                      description: >-
                        Repère posé sur la carte (facultatif, domicile seulement ; ignoré pour un
                        point relais). Hors du Congo : 422 location_out_of_area.
                couponCode:
                  type: string
                  pattern: '^[A-Za-z0-9]{3,20}$'
                  description: >-
                    Code promo d'une boutique du panier : remise sur ses articles, payée par le
                    vendeur. 422 coupon_invalid, coupon_exhausted, coupon_already_used,
                    coupon_min_subtotal ou coupon_not_applicable.
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/checkouts/{id}:
    get:
      tags: [Achat]
      summary: Panier validé et ses commandes
      operationId: getCheckout
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/checkouts/{id}/payments:
    post:
      tags: [Achat]
      summary: Lancer le paiement Mobile Money (F7)
      description: |
        Envoie la demande de validation (code PIN) sur le téléphone. Interroger ensuite
        `GET /v1/payments/{id}` toutes les 3 s. Une seule tentative en cours à la fois ; après un échec,
        une nouvelle tentative (autre numéro / opérateur) est possible tant que le panier n'a pas expiré.
      operationId: createPayment
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operator, phone]
              properties:
                operator: { $ref: '#/components/schemas/Operator' }
                phone: { type: string }
      responses:
        '201':
          description: Demande envoyée (ou refusée immédiatement)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/payments/{id}:
    get:
      tags: [Achat]
      summary: État d'un paiement (écran d'attente)
      operationId: getPayment
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/orders:
    get:
      tags: [Commandes]
      summary: Mes commandes (acheteur)
      operationId: myOrders
      responses:
        '200': { $ref: '#/components/responses/OrderList' }

        '401': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}:
    get:
      tags: [Commandes]
      summary: Détail et historique d'une commande
      description: >-
        Accessible à l'acheteur et au support. Le vendeur passe par `/v1/seller/orders/{id}`, qui
        ne contient pas le téléphone ni le repère de l'acheteur.
      operationId: getOrder
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Order'
                  - type: object
                    required: [history]
                    properties:
                      history: { $ref: '#/components/schemas/OrderHistory' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/orders/{id}/tracking:
    get:
      tags: [Commandes]
      summary: Livreur en route — prénom, téléphone, dernière position, temps d’arrivée
      operationId: orderTracking
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [onTheWay, rider, position, destination, distanceMeters, etaMinutes]
                properties:
                  onTheWay:
                    { type: boolean, description: 'Colis pris en charge, en route vers vous' }
                  rider:
                    type: [object, 'null']
                    required: [name, phone]
                    properties:
                      name: { type: string, examples: [Junior M.] }
                      phone: { type: string }
                  position:
                    type: [object, 'null']
                    description: Dernière position si elle a moins de 10 minutes
                    required: [lat, lng, accuracy, at]
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                      accuracy: { type: [number, 'null'] }
                      at: { type: string, format: date-time }
                  destination:
                    description: Repère posé à la commande, ou point relais
                    oneOf: [{ $ref: '#/components/schemas/GeoPoint' }, { type: 'null' }]
                  distanceMeters:
                    type: [integer, 'null']
                    description: À vol d'oiseau, entre le livreur et la destination
                  etaMinutes:
                    type: [integer, 'null']
                    description: Estimation (détour et vitesse d'une moto en ville compris)
        '404': { $ref: '#/components/responses/Error' }

  /v1/orders/{id}/messages:
    get:
      tags: [Commandes]
      summary: Conversation de la commande (acheteur, vendeur, livreur)
      description: >-
        Réservée aux participants : l'acheteur, le titulaire de la boutique et le livreur affecté.
        Aucun numéro de téléphone n'y figure. La lire la marque comme lue.
      operationId: orderMessages
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [orderId, publicRef, me, canWrite, participants, items]
                properties:
                  orderId: { type: string, format: uuid }
                  publicRef: { type: string }
                  me: { $ref: '#/components/schemas/ConversationRole' }
                  canWrite:
                    type: boolean
                    description: Faux une fois la commande terminée ou annulée (lecture seule).
                  participants:
                    type: array
                    items: { $ref: '#/components/schemas/ConversationParticipant' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrderMessage' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Commandes]
      summary: Écrire dans la conversation de la commande
      operationId: sendOrderMessage
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderMessageInput' }
      responses:
        '201':
          description: Envoyé (notification aux autres participants)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderMessage' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1/me/conversations:
    get:
      tags: [Commandes]
      summary: Conversations avec des messages non lus
      operationId: myConversations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [totalUnread, items]
                properties:
                  totalUnread: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [orderId, publicRef, unread, lastMessageAt]
                      properties:
                        orderId: { type: string, format: uuid }
                        publicRef: { type: string }
                        unread: { type: integer }
                        lastMessageAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }

  /v1/support/orders/{id}/messages:
    get:
      tags: [Support]
      summary: Conversation d'une commande (litige, incident)
      operationId: supportOrderMessages
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [orderId, publicRef, participants, items]
                properties:
                  orderId: { type: string, format: uuid }
                  publicRef: { type: string }
                  participants:
                    type: array
                    items: { $ref: '#/components/schemas/ConversationParticipant' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrderMessage' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Support]
      summary: Écrire dans la conversation au nom du support (journalisé)
      operationId: supportSendOrderMessage
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportMessageInput' }
      responses:
        '201':
          description: Envoyé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderMessage' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/orders/{id}/calls:
    post:
      tags: [Commandes]
      summary: Appeler un participant de la commande (appel internet, sans numéro)
      description: >-
        Crée l'appel, prévient l'appelé sur son téléphone et donne à l'appelant le jeton LiveKit
        de la salle. Sans réponse en 45 s, l'appel est manqué.
      operationId: startCall
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: '#/components/schemas/ConversationRole' }
      responses:
        '201':
          description: Ça sonne chez l'appelé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallWithAccess' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/calls/{id}:
    get:
      tags: [Commandes]
      summary: État d'un appel (appelant ou appelé)
      operationId: getCall
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Call' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/calls/{id}/accept:
    post:
      tags: [Commandes]
      summary: Décrocher (jeton LiveKit de la salle)
      operationId: acceptCall
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallWithAccess' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/calls/{id}/decline:
    post:
      tags: [Commandes]
      summary: Refuser un appel entrant
      operationId: declineCall
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Refusé }
        '404': { $ref: '#/components/responses/Error' }

  /v1/calls/{id}/end:
    post:
      tags: [Commandes]
      summary: Raccrocher, ou annuler avant la réponse
      operationId: endCall
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Terminé }
        '404': { $ref: '#/components/responses/Error' }

  /v1/me/calls/incoming:
    get:
      tags: [Commandes]
      summary: Appel qui sonne pour moi (interrogé par l'application au premier plan)
      operationId: incomingCalls
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Call' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/orders/{id}/rider-review:
    get:
      tags: [Commandes]
      summary: Avis sur le livreur de ma commande (peut-on noter, déjà noté)
      operationId: riderReviewStatus
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [canRate, rider, review]
                properties:
                  canRate:
                    type: boolean
                    description: Remise à domicile faite par un livreur, pas encore notée
                  rider:
                    oneOf:
                      - type: 'null'
                      - type: object
                        required: [name]
                        properties:
                          name: { type: string }
                  review:
                    oneOf:
                      - type: 'null'
                      - type: object
                        required: [rating, tags, comment, createdAt]
                        properties:
                          rating: { type: integer }
                          tags:
                            type: array
                            items: { $ref: '#/components/schemas/RiderReviewTag' }
                          comment: { type: [string, 'null'] }
                          createdAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Commandes]
      summary: Noter le livreur après la remise (une fois)
      description: Une note de 2 ou moins prévient le support.
      operationId: reviewRider
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                tags:
                  type: array
                  maxItems: 3
                  items: { $ref: '#/components/schemas/RiderReviewTag' }
                comment: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Enregistré
          content:
            application/json:
              schema:
                type: object
                required: [recorded]
                properties:
                  recorded: { type: boolean }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/orders/{id}/cancel:
    post:
      tags: [Commandes]
      summary: Annuler avant acceptation du vendeur (remboursement intégral)
      operationId: cancelOrder
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/OrderStatusChange' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/orders/{id}/confirm-receipt:
    post:
      tags: [Commandes]
      summary: « Tout est conforme » — libère le paiement au vendeur sans attendre 48 h
      operationId: confirmReceipt
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/OrderStatusChange' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/orders/{id}/disputes:
    post:
      tags: [Commandes]
      summary: Signaler un problème dans les 48 h suivant la remise (F12)
      operationId: openDispute
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, description]
              properties:
                reason:
                  type: string
                  enum: [not_received, not_as_described, damaged, counterfeit, missing_items, other]
                description: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '201':
          description: Litige ouvert
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, const: open }
        '409': { $ref: '#/components/responses/Error' }

  /v1/orders/{id}/handover-code:
    post:
      tags: [Commandes]
      summary: Recevoir un nouveau code de remise par SMS (l'ancien est invalidé)
      operationId: regenerateHandoverCode
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '202': { description: Code envoyé }
        '409': { $ref: '#/components/responses/Error' }

  /v1/rider/me:
    get:
      tags: [Livreur]
      summary: Profil du livreur et courses du jour
      operationId: riderMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    fullName,
                    phone,
                    partnerName,
                    partnerPhone,
                    zone,
                    city,
                    deliveredTotal,
                    deliveredToday,
                    inProgress,
                    rating,
                  ]
                properties:
                  fullName: { type: [string, 'null'] }
                  phone: { type: string }
                  partnerName: { type: string, description: Société de livraison partenaire }
                  partnerPhone: { type: [string, 'null'] }
                  zone: { type: [string, 'null'] }
                  city: { type: [string, 'null'] }
                  deliveredTotal: { type: integer }
                  deliveredToday:
                    { type: integer, description: 'Depuis minuit, heure de Brazzaville' }
                  inProgress: { type: integer }
                  rating: { $ref: '#/components/schemas/RiderRating' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/rider/history:
    get:
      tags: [Livreur]
      summary: Courses terminées (livrées, rapportées, échouées)
      operationId: riderHistory
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: ['7d', '30d'], default: '7d' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [delivered, returned, averageMinutes, items]
                properties:
                  delivered: { type: integer }
                  returned: { type: integer, description: Rapportées au vendeur ou échouées }
                  averageMinutes:
                    type: [integer, 'null']
                    description: Durée moyenne entre la prise en charge et la remise
                  items:
                    type: array
                    items:
                      type: object
                      required: [orderId, publicRef, from, to, outcome, at, minutes, reason]
                      properties:
                        orderId: { type: string, format: uuid }
                        publicRef: { type: string }
                        from: { type: string, description: Quartier du vendeur }
                        to: { type: string, description: Quartier de livraison }
                        outcome: { type: string, enum: [delivered, returned, failed] }
                        at: { type: string, format: date-time }
                        minutes: { type: [integer, 'null'] }
                        reason: { type: [string, 'null'] }

  /v1/rider/deliveries:
    get:
      tags: [Livreur]
      summary: Mes missions en cours
      operationId: riderDeliveries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RiderMission' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/rider/deliveries/{id}:
    get:
      tags: [Livreur]
      summary: Détail d'une mission (id = commande)
      operationId: riderDelivery
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderMission' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/rider/deliveries/{id}/pickup:
    post:
      tags: [Livreur]
      summary: J'ai récupéré le colis
      operationId: riderPickup
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/OrderStatusChange' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/rider/deliveries/{id}/arrived:
    post:
      tags: [Livreur]
      summary: Arrivé chez le client (livraison à domicile)
      description: >-
        Un SMS prévient le client et l'attente commence ; au bout de RIDER_ABSENT_WAIT_MINUTES
        (10 min par défaut), le livreur peut le déclarer absent.
      operationId: riderArrived
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [arrivedAt, absentAllowedAt]
                properties:
                  arrivedAt: { type: string, format: date-time }
                  absentAllowedAt: { type: string, format: date-time }
        '409': { $ref: '#/components/responses/Error' }

  /v1/rider/deliveries/{id}/position:
    post:
      tags: [Livreur]
      summary: Position du livreur en route vers le client
      description: >-
        Envoyée toutes les 15 s environ, application au premier plan. Seule la dernière position
        est gardée ; elle est effacée dès que le colis n'est plus en route.
      operationId: riderPosition
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                accuracy: { type: number, minimum: 0, description: Précision en mètres }
      responses:
        '204': { description: Enregistrée }
        '409': { $ref: '#/components/responses/Error' }

  /v1/rider/deliveries/{id}/contact-attempt:
    post:
      tags: [Livreur]
      summary: Noter un appel au client pendant l'attente
      operationId: riderContactAttempt
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201': { $ref: '#/components/responses/Recorded' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1/rider/deliveries/{id}/return:
    post:
      tags: [Livreur]
      summary: Cliente absente ou colis refusé — rapporter le colis au vendeur
      description: >-
        « absent » seulement après l'attente. Un code de retour est créé ; l'argent de la cliente
        reste bloqué et le support est prévenu.
      operationId: riderReturn
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [absent, refused] }
                note: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          description: Mission mise à jour (avec le code de retour)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderMission' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/rider/deliveries/{id}/returned:
    post:
      tags: [Livreur]
      summary: Colis rendu au vendeur (code de retour confirmé par le vendeur)
      description: La commande passe en litige ; le support décide de la suite.
      operationId: riderReturned
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/OrderStatusChange' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/rider/deliveries/{id}/incident:
    post:
      tags: [Livreur]
      summary: Signaler un incident (le support est prévenu)
      operationId: riderIncident
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { $ref: '#/components/schemas/DeliveryIncident' }
                note: { type: string, maxLength: 500 }
      responses:
        '201': { $ref: '#/components/responses/Recorded' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/rider/deliveries/{id}/arrived-at-pickup-point:
    post:
      tags: [Livreur]
      summary: Colis déposé au point relais
      operationId: riderArrivedAtPickupPoint
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/OrderStatusChange' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/rider/deliveries/{id}/handover:
    post:
      tags: [Livreur]
      summary: Remise en main propre avec le code de l'acheteur (F10)
      operationId: riderHandover
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200': { $ref: '#/components/responses/OrderStatusChange' }
        '422': { $ref: '#/components/responses/Error' }
        '423':
          description: Verrouillé après 5 codes erronés — contacter le support
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/rider/deliveries/{id}/failed:
    post:
      tags: [Livreur]
      summary: Livraison impossible (ouvre un litige)
      operationId: riderDeliveryFailed
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/OrderStatusChange' }

        '401': { $ref: '#/components/responses/Error' }
  /v1/support/orders/{id}/cancel:
    post:
      tags: [Support]
      summary: Annuler une commande payée non expédiée (remboursement intégral)
      operationId: supportCancelOrder
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/OrderStatusChange' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/support/withdrawals:
    get:
      tags: [Support]
      summary: Retraits à contrôler (au-delà du seuil)
      operationId: supportWithdrawals
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          id,
                          amount,
                          status,
                          createdAt,
                          operator,
                          phone,
                          sellerId,
                          shopName,
                          accountName,
                          verificationStatus,
                        ]
                      properties:
                        id: { type: string, format: uuid }
                        amount: { $ref: '#/components/schemas/Amount' }
                        status: { $ref: '#/components/schemas/PayoutStatus' }
                        createdAt: { type: string, format: date-time }
                        operator: { $ref: '#/components/schemas/Operator' }
                        phone: { type: string }
                        sellerId: { type: string, format: uuid }
                        shopName: { type: string }
                        accountName: { type: [string, 'null'] }
                        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }

  /v1/support/withdrawals/{id}/decision:
    post:
      tags: [Support]
      summary: Valider ou refuser un retrait (administrateurs)
      operationId: decideWithdrawal
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/PayoutStatus' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/support/delivery-events:
    get:
      tags: [Support]
      summary: Incidents, absences et refus des 7 derniers jours
      operationId: supportDeliveryEvents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          id,
                          kind,
                          incident,
                          note,
                          at,
                          orderId,
                          publicRef,
                          deliveryStatus,
                          riderName,
                          riderPhone,
                        ]
                      properties:
                        id: { type: string }
                        kind: { type: string, enum: [incident, absent, refused] }
                        incident:
                          oneOf:
                            - { $ref: '#/components/schemas/DeliveryIncident' }
                            - { type: 'null' }
                        note: { type: [string, 'null'] }
                        at: { type: string, format: date-time }
                        orderId: { type: string, format: uuid }
                        publicRef: { type: string }
                        deliveryStatus: { $ref: '#/components/schemas/DeliveryStatus' }
                        riderName: { type: [string, 'null'] }
                        riderPhone: { type: [string, 'null'] }

  /v1/support/deliveries/{id}/assign:
    post:
      tags: [Support]
      summary: Assigner un livreur à la commande
      operationId: assignRider
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [riderId]
              properties:
                riderId: { type: string, format: uuid }
      responses:
        '200':
          description: Assigné
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  riderId: { type: string, format: uuid }
                  status: { type: string, const: assigned }
        '409': { $ref: '#/components/responses/Error' }

  /v1/support/disputes/{id}/resolve:
    post:
      tags: [Support]
      summary: Trancher un litige (F9, F12)
      operationId: resolveDispute
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution, note]
              properties:
                resolution: { type: string, enum: [release_to_seller, refund_full, refund_partial] }
                refundAmount:
                  $ref: '#/components/schemas/Amount'
                  description: Requis pour `refund_partial`, inférieur à la valeur des articles
                note: { type: string, minLength: 5, maxLength: 2000 }
      responses:
        '200':
          description: Décision appliquée
          content:
            application/json:
              schema:
                type: object
                properties:
                  disputeId: { type: string, format: uuid }
                  orderId: { type: string, format: uuid }
                  orderStatus: { $ref: '#/components/schemas/OrderStatus' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/admin/sellers/{id}/verification:
    post:
      tags: [Support]
      summary: Décision de vérification d'un vendeur (F2)
      operationId: verifySeller
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [verified, rejected, suspended] }
                reason: { type: string, description: Requis sauf pour `verified` }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  verificationStatus: { type: string }

        '401': { $ref: '#/components/responses/Error' }
  /v1/admin/products/{id}/moderation:
    post:
      tags: [Support]
      summary: Modérer un produit (F16)
      operationId: moderateProduct
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [published, rejected] }
                reason: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }

        '401': { $ref: '#/components/responses/Error' }
  /v1/admin/ledger/balances:
    get:
      tags: [Support]
      summary: Contrôle comptable — la balance générale doit valoir 0
      operationId: ledgerBalances
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [trialBalance, accounts]
                properties:
                  trialBalance:
                    type: integer
                    description: Somme de toutes les écritures ; tout autre résultat que 0 est un incident
                  accounts:
                    type: array
                    items:
                      type: object
                      required: [code, balance]
                      properties:
                        code: { type: string, examples: ['liability:escrow'] }
                        balance: { type: integer }

        '401': { $ref: '#/components/responses/Error' }
  /v1/webhooks/payments/{provider}:
    post:
      tags: [Webhooks]
      summary: Notification signée de l'agrégateur
      description: |
        Corps brut vérifié par signature (HMAC + horodatage). Dédoublonné par identifiant d'événement :
        un rejeu renvoie `duplicate` sans effet.
      operationId: paymentWebhook
      security: []
      parameters:
        - {
            name: provider,
            in: path,
            required: true,
            schema: { type: string, examples: [simulator] },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Traité
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcome: { type: string, enum: [processed, duplicate, ignored] }
        '401': { $ref: '#/components/responses/Error' }

  /v1/products/{id}/reviews:
    get:
      tags: [Catalogue]
      summary: Avis vérifiés d'un produit (F11)
      operationId: listProductReviews
      security: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, rating, comment, tags, createdAt, authorName, sellerReply]
                      properties:
                        id: { type: string, format: uuid }
                        rating: { type: integer, minimum: 1, maximum: 5 }
                        comment: { type: [string, 'null'] }
                        tags:
                          type: array
                          items: { $ref: '#/components/schemas/ReviewTag' }
                        createdAt: { type: string, format: date-time }
                        authorName: { type: string }
                        sellerReply:
                          { type: [string, 'null'], description: Réponse publique du vendeur }
        '400': { $ref: '#/components/responses/Error' }

  /v1/uploads:
    post:
      tags: [Fichiers]
      summary: Réserver l'envoi d'un fichier et obtenir une URL signée
      description: |
        Photos produits (vendeur, compartiment public, JPEG/PNG/WebP ≤ 2 Mo), pièces KYC (vendeur,
        compartiment privé, image ou PDF ≤ 5 Mo), preuves de litige (acheteur, privé, image ≤ 3 Mo).
        L'URL est valable 15 min ; le fichier doit être rattaché dans les 24 h.
      operationId: reserveUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, contentType, sizeBytes]
              properties:
                purpose:
                  {
                    type: string,
                    enum: [product_photo, kyc_document, dispute_evidence, message_photo],
                  }
                contentType: { type: string, examples: [image/jpeg] }
                sizeBytes: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Envoi réservé
          content:
            application/json:
              schema:
                type: object
                required: [uploadId, method, url, fields, headers, expiresAt, maxBytes]
                properties:
                  uploadId: { type: string, format: uuid }
                  method: { type: string, enum: [POST, PUT] }
                  url: { type: string, format: uri }
                  fields: { type: object, additionalProperties: { type: string } }
                  headers: { type: object, additionalProperties: { type: string } }
                  expiresAt: { type: string, format: date-time }
                  maxBytes: { type: integer }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1/seller/commission-preview:
    get:
      tags: [Vendeur]
      summary: « Vous recevrez » — commission et net pour un prix et une catégorie
      operationId: commissionPreview
      parameters:
        - { name: categoryId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: price, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [rateBps, commission, net]
                properties:
                  rateBps: { type: integer, description: Taux en points de base (1000 = 10 %) }
                  commission: { $ref: '#/components/schemas/Amount' }
                  net: { $ref: '#/components/schemas/Amount' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/seller/products/{id}:
    get:
      tags: [Vendeur]
      summary: Fiche complète d'un de mes produits (écran de modification)
      operationId: getMyProduct
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerProduct' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Vendeur]
      summary: Modifier, publier, archiver ou remettre en vente un produit
      description: >-
        Un vendeur non vérifié qui modifie le texte, la catégorie ou les photos repasse en
        modération. `status=published` publie un brouillon (au moins une photo, sinon
        `photo_required`), remet en vente un produit archivé, ou soumet à nouveau un produit refusé
        (toujours en modération).
      operationId: updateProduct
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                categoryId: { type: string, format: uuid }
                title: { type: string, minLength: 3, maxLength: 140 }
                description: { type: string, maxLength: 5000 }
                price: { $ref: '#/components/schemas/Amount' }
                stock: { type: integer, minimum: 0 }
                condition: { $ref: '#/components/schemas/ProductCondition' }
                lowStockThreshold: { type: integer, minimum: 0, maximum: 1000 }
                status: { type: string, enum: [archived, published] }
      responses:
        '200':
          description: Modifié
          content:
            application/json:
              schema:
                type: object
                required: [id, title, price, stock, status]
                properties:
                  id: { type: string, format: uuid }
                  title: { type: string }
                  price: { $ref: '#/components/schemas/Amount' }
                  stock: { type: integer }
                  status: { $ref: '#/components/schemas/ProductStatus' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/seller/products/{id}/photos:
    post:
      tags: [Vendeur]
      summary: Ajouter une photo déjà envoyée (6 au maximum)
      description: >-
        Un renvoi du même `uploadId` sur le même produit (réponse perdue) est sans effet.
      operationId: addProductPhoto
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId]
              properties:
                uploadId: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/PhotoList' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/seller/products/{id}/photos/{photoId}:
    delete:
      tags: [Vendeur]
      summary: Retirer une photo
      operationId: removeProductPhoto
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/PhotoList' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/seller/kyc:
    get:
      tags: [Vendeur]
      summary: État de ma vérification (F2)
      operationId: getMyKyc
      responses:
        '200': { $ref: '#/components/responses/KycStatus' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/seller/kyc-documents:
    post:
      tags: [Vendeur]
      summary: Ajouter une pièce à mon dossier de vérification
      description: Dossier complet (identité + selfie, + RCCM et NIU pour une entreprise) → « pending_review ».
      operationId: addKycDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId, type]
              properties:
                uploadId: { type: string, format: uuid }
                type: { $ref: '#/components/schemas/KycDocumentType' }
      responses:
        '201': { $ref: '#/components/responses/KycStatus' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/order-items/{id}/review:
    post:
      tags: [Commandes]
      summary: Noter un article reçu (F11)
      description: Réservé à l'acheteur, après la remise ; un seul avis par article.
      operationId: reviewOrderItem
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 2000 }
                tags:
                  type: array
                  maxItems: 3
                  items: { $ref: '#/components/schemas/ReviewTag' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/disputes/{id}/evidence:
    post:
      tags: [Commandes]
      summary: Joindre une photo à mon litige (6 au maximum)
      operationId: addDisputeEvidence
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId]
              properties:
                uploadId: { type: string, format: uuid }
      responses:
        '201':
          description: Ajoutée
          content:
            application/json:
              schema:
                type: object
                properties:
                  disputeId: { type: string, format: uuid }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/support/disputes:
    get:
      tags: [Support]
      summary: Litiges ouverts (les plus urgents d'abord) ou résolus
      operationId: listOpenDisputes
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved], default: open }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [counts, items]
                properties:
                  counts:
                    type: object
                    required: [open, resolved]
                    properties:
                      open: { type: integer }
                      resolved: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          id,
                          reason,
                          status,
                          slaDueAt,
                          createdAt,
                          orderId,
                          publicRef,
                          total,
                          shopName,
                          buyerName,
                          sellerChoice,
                        ]
                      properties:
                        shopName: { type: string }
                        buyerName: { type: [string, 'null'] }
                        sellerChoice:
                          oneOf:
                            - type: 'null'
                            - $ref: '#/components/schemas/DisputeSellerChoice'
                        id: { type: string, format: uuid }
                        reason: { $ref: '#/components/schemas/DisputeReason' }
                        status: { type: string, enum: [open, resolved] }
                        slaDueAt: { type: string, format: date-time }
                        createdAt: { type: string, format: date-time }
                        orderId: { type: string, format: uuid }
                        publicRef: { type: string }
                        total: { $ref: '#/components/schemas/Amount' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/support/disputes/{id}:
    get:
      tags: [Support]
      summary: Détail d'un litige, commande et preuves (URL signées 5 min, consultation journalisée)
      operationId: getDispute
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    id,
                    orderId,
                    reason,
                    description,
                    status,
                    resolution,
                    refundAmount,
                    decisionNote,
                    slaDueAt,
                    createdAt,
                    sellerChoice,
                    sellerMessage,
                    sellerRespondedAt,
                    order,
                    evidence,
                  ]
                properties:
                  id: { type: string, format: uuid }
                  orderId: { type: string, format: uuid }
                  reason: { $ref: '#/components/schemas/DisputeReason' }
                  description: { type: string }
                  status: { type: string, enum: [open, resolved] }
                  resolution:
                    type: [string, 'null']
                    enum: [release_to_seller, refund_full, refund_partial, null]
                  refundAmount: { type: [integer, 'null'] }
                  decisionNote: { type: [string, 'null'] }
                  slaDueAt: { type: string, format: date-time }
                  createdAt: { type: string, format: date-time }
                  sellerChoice:
                    oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/DisputeSellerChoice'
                  sellerMessage: { type: [string, 'null'] }
                  sellerRespondedAt: { type: [string, 'null'], format: date-time }
                  order: { $ref: '#/components/schemas/Order' }
                  evidence:
                    type: array
                    items:
                      type: object
                      required: [id, kind, from, url]
                      properties:
                        id: { type: string, format: uuid }
                        kind: { type: string }
                        from: { type: string, enum: [buyer, seller] }
                        url: { type: string, format: uri }
        '404': { $ref: '#/components/responses/Error' }

  /v1/admin/sellers:
    get:
      tags: [Support]
      summary: File de vérification des vendeurs
      operationId: listSellersByStatus
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/VerificationStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [counts, items]
                properties:
                  counts:
                    type: object
                    required: [pending_review, verified, suspended, unverified, rejected]
                    properties:
                      pending_review: { type: integer }
                      verified: { type: integer }
                      suspended: { type: integer }
                      unverified: { type: integer }
                      rejected: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          id,
                          shopName,
                          kind,
                          city,
                          verificationStatus,
                          phone,
                          managerName,
                          pendingDocuments,
                          documentsComplete,
                          lastDocumentAt,
                          createdAt,
                        ]
                      properties:
                        id: { type: string, format: uuid }
                        shopName: { type: string }
                        kind: { type: string, enum: [individual, business] }
                        city: { type: string }
                        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
                        phone: { type: string }
                        managerName: { type: [string, 'null'] }
                        pendingDocuments: { type: integer }
                        documentsComplete:
                          { type: boolean, description: Pièce d'identité et selfie reçus }
                        lastDocumentAt: { type: [string, 'null'], format: date-time }
                        createdAt: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error' }

  /v1/admin/sellers/{id}/kyc-documents:
    get:
      tags: [Support]
      summary: Pièces d'un vendeur (URL signées 5 min, consultation journalisée)
      operationId: listSellerKycDocuments
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, type, status, createdAt, url]
                      properties:
                        id: { type: string, format: uuid }
                        type: { $ref: '#/components/schemas/KycDocumentType' }
                        status: { type: string, enum: [pending, accepted, rejected] }
                        createdAt: { type: string, format: date-time }
                        url: { type: string, format: uri }
        '403': { $ref: '#/components/responses/Error' }

  /v1/auth/mfa:
    get:
      tags: [Authentification]
      summary: État du second facteur (personnel)
      operationId: mfaStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [required, enrolled, verified]
                properties:
                  required:
                    type: boolean
                    description: Le compte doit valider un code TOTP pour les routes du personnel
                  enrolled: { type: boolean }
                  verified: { type: boolean, description: Code validé pour cette session }
        '401': { $ref: '#/components/responses/Error' }

  /v1/auth/mfa/setup:
    post:
      tags: [Authentification]
      summary: Configurer le second facteur — nouveau secret à scanner (QR code)
      operationId: mfaSetup
      responses:
        '200':
          description: Secret à saisir ou scanner dans l'application d'authentification
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUrl]
                properties:
                  secret: { type: string, description: 'Base32, à saisir à la main si besoin' }
                  otpauthUrl: { type: string, examples: ['otpauth://totp/…'] }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/auth/mfa/confirm:
    post:
      tags: [Authentification]
      summary: Premier code de l'application — active le second facteur et valide la session
      operationId: mfaConfirm
      requestBody: { $ref: '#/components/requestBodies/TotpCode' }
      responses:
        '204': { description: 'Second facteur actif, session validée' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/auth/mfa/verify:
    post:
      tags: [Authentification]
      summary: Code TOTP à chaque connexion du personnel
      description: Un code ne sert qu'une fois ; 5 codes erronés révoquent la session (`mfa_locked`).
      operationId: mfaVerify
      requestBody: { $ref: '#/components/requestBodies/TotpCode' }
      responses:
        '204': { description: Session validée }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/admin/users/{id}/mfa/reset:
    post:
      tags: [Personnel]
      summary: Téléphone perdu — effacer le second facteur d'un membre du personnel (administrateur)
      operationId: mfaReset
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Effacé ; sessions ouvertes à revalider }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/admin/sellers/{id}:
    get:
      tags: [Support]
      summary: Fiche d'une boutique (décision de vérification)
      operationId: getSellerForReview
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    id,
                    shopName,
                    kind,
                    city,
                    verificationStatus,
                    rejectionReason,
                    payoutPhone,
                    payoutOperator,
                    payoutAccountName,
                    createdAt,
                    phone,
                    rccm,
                    niu,
                    openingHours,
                    soldCategories,
                    fullName,
                    pickupZone,
                    productCount,
                    orderCount,
                  ]
                properties:
                  id: { type: string, format: uuid }
                  shopName: { type: string }
                  kind: { type: string, enum: [individual, business] }
                  city: { type: string }
                  verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
                  rejectionReason: { type: [string, 'null'] }
                  payoutPhone: { type: string }
                  payoutOperator: { $ref: '#/components/schemas/Operator' }
                  payoutAccountName:
                    { type: [string, 'null'], description: À comparer au nom de la pièce }
                  createdAt: { type: string, format: date-time }
                  phone: { type: string }
                  rccm: { type: [string, 'null'] }
                  niu: { type: [string, 'null'] }
                  openingHours: { type: [string, 'null'] }
                  soldCategories: { type: array, items: { type: string } }
                  fullName: { type: [string, 'null'] }
                  pickupZone: { type: string }
                  productCount: { type: integer }
                  orderCount: { type: integer }
        '404': { $ref: '#/components/responses/Error' }

  /v1/admin/products:
    get:
      tags: [Support]
      summary: File de modération des produits
      operationId: listProductsForModeration
      parameters:
        - name: status
          in: query
          schema:
            { type: string, enum: [pending_review, rejected, published], default: pending_review }
      responses:
        '200':
          description: OK, les plus anciens d'abord
          content:
            application/json:
              schema:
                type: object
                required: [counts, items]
                properties:
                  counts:
                    type: object
                    required: [pending_review, published, rejected]
                    properties:
                      pending_review: { type: integer }
                      published: { type: integer }
                      rejected: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          id,
                          title,
                          description,
                          price,
                          stock,
                          status,
                          rejectionReason,
                          updatedAt,
                          category,
                          condition,
                          sellerId,
                          shopName,
                          sellerVerification,
                          photos,
                          alerts,
                        ]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        description: { type: string }
                        price: { $ref: '#/components/schemas/Amount' }
                        stock: { type: integer }
                        status: { $ref: '#/components/schemas/ProductStatus' }
                        rejectionReason: { type: [string, 'null'] }
                        updatedAt: { type: string, format: date-time }
                        category: { type: string }
                        sellerId: { type: string, format: uuid }
                        shopName: { type: string }
                        sellerVerification: { $ref: '#/components/schemas/VerificationStatus' }
                        condition: { $ref: '#/components/schemas/ProductCondition' }
                        photos: { type: array, items: { type: string, format: uri } }
                        alerts:
                          type: array
                          description: >-
                            Alertes calculées : prix sous 40 % du prix médian de la catégorie,
                            photo unique, description vide
                          items: { type: string, enum: [low_price, single_photo, no_description] }
        '403': { $ref: '#/components/responses/Error' }

  /v1/support/dashboard:
    get:
      tags: [Support]
      summary: Vue d'ensemble — volume, argent bloqué, commissions, litiges, 14 derniers jours
      description: Les commissions ne sont renvoyées qu'aux administrateurs (null pour le support).
      operationId: supportDashboard
      parameters:
        - { $ref: '#/components/parameters/Period' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [period, volume, escrow, commission, disputes, todo, daily]
                properties:
                  period: { type: string, enum: [today, 7d, 30d] }
                  volume:
                    type: object
                    required: [amount, paidOrders]
                    properties:
                      amount: { $ref: '#/components/schemas/Amount' }
                      paidOrders: { type: integer }
                  escrow:
                    type: object
                    required: [amount, orders]
                    properties:
                      amount: { $ref: '#/components/schemas/Amount' }
                      orders: { type: integer }
                  commission:
                    type: [object, 'null']
                    required: [amount, rateBps]
                    properties:
                      amount: { $ref: '#/components/schemas/Amount' }
                      rateBps: { type: integer }
                  disputes:
                    type: object
                    required: [open, dueToday, first]
                    properties:
                      open: { type: integer }
                      dueToday: { type: integer }
                      first:
                        type: [object, 'null']
                        required: [id, publicRef, reason]
                        properties:
                          id: { type: string, format: uuid }
                          publicRef: { type: string }
                          reason: { $ref: '#/components/schemas/DisputeReason' }
                  todo:
                    type: object
                    required: [kycPending, productsPending, deliveriesToAssign, moneyFailures]
                    properties:
                      kycPending: { type: integer }
                      productsPending: { type: integer }
                      deliveriesToAssign: { type: integer }
                      moneyFailures: { type: integer }
                  daily:
                    type: array
                    items:
                      type: object
                      required: [date, orders]
                      properties:
                        date: { type: string, format: date }
                        orders: { type: integer }
        '403': { $ref: '#/components/responses/Error' }

  /v1/support/payments:
    get:
      tags: [Support]
      summary: Paiements — encaissé, séquestre, libéré, par opérateur, mouvements
      operationId: supportPayments
      parameters:
        - { $ref: '#/components/parameters/Period' }
        - name: kind
          in: query
          schema: { type: string, enum: [all, in, out], default: all }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    period,
                    collected,
                    escrow,
                    released,
                    payoutsPending,
                    failures,
                    byOperator,
                    movements,
                  ]
                properties:
                  period: { type: string, enum: [today, 7d, 30d] }
                  collected:
                    type: object
                    required: [amount, count]
                    properties:
                      amount: { $ref: '#/components/schemas/Amount' }
                      count: { type: integer }
                  escrow: { $ref: '#/components/schemas/Amount' }
                  released:
                    type: object
                    required: [amount, sellers]
                    properties:
                      amount: { $ref: '#/components/schemas/Amount' }
                      sellers: { type: integer }
                  payoutsPending: { type: integer }
                  failures: { type: integer }
                  byOperator:
                    type: array
                    items:
                      type: object
                      required: [operator, amount]
                      properties:
                        operator: { $ref: '#/components/schemas/Operator' }
                        amount: { $ref: '#/components/schemas/Amount' }
                  movements:
                    type: array
                    items:
                      type: object
                      required: [kind, at, reference, beneficiary, operator, amount, status]
                      properties:
                        kind: { type: string, enum: [collection, payout, refund] }
                        at: { type: string, format: date-time }
                        reference: { type: [string, 'null'] }
                        beneficiary: { type: [string, 'null'] }
                        operator: { $ref: '#/components/schemas/Operator' }
                        amount: { type: integer, description: Négatif pour une sortie }
                        status: { type: string }
        '403': { $ref: '#/components/responses/Error' }

  /v1/support/customers:
    get:
      tags: [Support]
      summary: Clients — recherche par nom ou numéro
      operationId: listCustomers
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 60 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerSummary' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/support/customers/{id}:
    get:
      tags: [Support]
      summary: Fiche d'un client (consultation journalisée)
      operationId: getCustomer
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CustomerSummary'
                  - type: object
                    required: [addresses, recentOrders]
                    properties:
                      addresses:
                        type: array
                        items:
                          type: object
                          required: [zone, city, landmark]
                          properties:
                            zone: { type: string }
                            city: { type: string }
                            landmark: { type: [string, 'null'] }
                      recentOrders:
                        type: array
                        items:
                          type: object
                          required:
                            [
                              id,
                              publicRef,
                              status,
                              total,
                              createdAt,
                              shopName,
                              disputeId,
                              disputeReason,
                            ]
                          properties:
                            id: { type: string, format: uuid }
                            publicRef: { type: string }
                            status: { $ref: '#/components/schemas/OrderStatus' }
                            total: { $ref: '#/components/schemas/Amount' }
                            createdAt: { type: string, format: date-time }
                            shopName: { type: string }
                            disputeId: { type: [string, 'null'], format: uuid }
                            disputeReason:
                              oneOf:
                                - type: 'null'
                                - $ref: '#/components/schemas/DisputeReason'
        '404': { $ref: '#/components/responses/Error' }

  /v1/support/customers/{id}/status:
    post:
      tags: [Support]
      summary: Bloquer ou débloquer un compte client (sessions fermées, journalisé)
      operationId: setCustomerStatus
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [active, suspended] }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [active, suspended] }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/support/disputes/{id}/remind-seller:
    post:
      tags: [Support]
      summary: Relancer le vendeur qui n'a pas répondu au litige
      operationId: remindSellerOfDispute
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Rappel envoyé
          content:
            application/json:
              schema:
                type: object
                required: [id, reminded]
                properties:
                  id: { type: string, format: uuid }
                  reminded: { type: boolean }
        '409': { $ref: '#/components/responses/Error' }

  /v1/admin/settings:
    get:
      tags: [Support]
      summary: Réglages en vigueur — commission par défaut, livraison, délais
      operationId: adminSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSettings' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Support]
      summary: Régler le délai d'acceptation du vendeur (administrateurs)
      description: >-
        Valeur choisie parmi `delays.sellerAcceptance.choices`, avec un motif (journal d'audit).
        Elle s'applique aux commandes payées après le changement ; les délais déjà donnés ne
        bougent pas.
      operationId: updateAdminSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                sellerAcceptanceMinutes:
                  type: integer
                  enum: [10, 30, 60, 120, 240, 720, 1440]
                acceptanceOpenHoursOnly: { type: boolean }
                payoutMode: { type: string, enum: [automatic, on_demand] }
                withdrawalReviewAmount: { type: integer, minimum: 10000, maximum: 10000000 }
                reason: { type: string, minLength: 5, maxLength: 300 }
      responses:
        '200':
          description: Réglages mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/support/overview:
    get:
      tags: [Support]
      summary: Tableau de bord — taille des files et activité du jour (heure de Pointe-Noire)
      operationId: supportOverview
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [queues, today]
                properties:
                  queues:
                    type: object
                    required:
                      [
                        kycPending,
                        productsPending,
                        deliveriesToAssign,
                        disputesOpen,
                        disputesOverdue,
                        alerts,
                      ]
                    properties:
                      kycPending: { type: integer }
                      productsPending: { type: integer }
                      deliveriesToAssign: { type: integer }
                      disputesOpen: { type: integer }
                      disputesOverdue: { type: integer }
                      alerts: { type: integer }
                  today:
                    type: object
                    required: [paidOrders, paidAmount, completedOrders, newShops]
                    properties:
                      paidOrders: { type: integer }
                      paidAmount: { $ref: '#/components/schemas/Amount' }
                      completedOrders: { type: integer }
                      newShops: { type: integer }
        '403': { $ref: '#/components/responses/Error' }

  /v1/support/deliveries:
    get:
      tags: [Support]
      summary: Livraisons à assigner — colis prêts d'abord
      operationId: deliveriesToAssign
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          orderId,
                          publicRef,
                          orderStatus,
                          deliveryMode,
                          shopName,
                          pickupZone,
                          destinationZone,
                          city,
                          pickupPoint,
                          paidAt,
                          readyAt,
                          itemCount,
                        ]
                      properties:
                        orderId: { type: string, format: uuid }
                        publicRef: { type: string }
                        orderStatus: { $ref: '#/components/schemas/OrderStatus' }
                        deliveryMode: { type: string, enum: [home, pickup_point] }
                        shopName: { type: string }
                        pickupZone: { type: string }
                        destinationZone: { type: string }
                        city: { type: string }
                        pickupPoint: { type: [string, 'null'] }
                        paidAt: { type: [string, 'null'], format: date-time }
                        readyAt: { type: [string, 'null'], format: date-time }
                        itemCount: { type: integer }
        '403': { $ref: '#/components/responses/Error' }

  /v1/support/riders:
    get:
      tags: [Support]
      summary: Livreurs actifs et missions en cours
      operationId: listRiders
      responses:
        '200':
          description: OK, les moins chargés d'abord
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          id,
                          phone,
                          name,
                          partner,
                          zone,
                          activeMissions,
                          lastPositionAt,
                          ratingAverage,
                          ratingCount,
                        ]
                      properties:
                        id: { type: string, format: uuid }
                        phone: { type: string }
                        name: { type: [string, 'null'] }
                        partner: { type: string }
                        zone: { type: [string, 'null'] }
                        activeMissions: { type: integer }
                        lastPositionAt:
                          type: [string, 'null']
                          format: date-time
                          description: Dernière position partagée pendant une course en route
                        ratingAverage:
                          type: [number, 'null']
                          description: Note moyenne donnée par les acheteurs (90 jours)
                        ratingCount: { type: integer }
        '403': { $ref: '#/components/responses/Error' }

  /v1/support/orders:
    get:
      tags: [Support]
      summary: Recherche de commandes par référence (ZD-…) ou téléphone
      description: >-
        Téléphone de l'acheteur, du vendeur ou du destinataire. Sans `q` : les 50 dernières
        commandes.
      operationId: searchOrders
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 40, examples: [ZD-7K3M9Q2P, 06 612 34 56] }
        - name: status
          in: query
          description: Onglet de la liste — un ou plusieurs statuts séparés par des virgules
          schema: { type: string, examples: ['paid,preparing'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [counts, items]
                properties:
                  counts:
                    type: object
                    description: Nombre de commandes par statut (onglets)
                    additionalProperties: { type: integer }
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Order'
                        - type: object
                          required: [buyerName, riderName, operator]
                          properties:
                            buyerName: { type: [string, 'null'] }
                            riderName: { type: [string, 'null'] }
                            operator:
                              oneOf:
                                - type: 'null'
                                - $ref: '#/components/schemas/Operator'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/support/orders/{id}:
    get:
      tags: [Support]
      summary: Dossier complet d'une commande (argent, livraison, litige)
      operationId: getOrderForSupport
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportOrder' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/support/alerts:
    get:
      tags: [Support]
      summary: Alertes — reversements et remboursements en échec (30 j), litiges en retard
      operationId: supportAlerts
      responses:
        '200':
          description: OK, les plus anciennes d'abord
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, id, orderId, publicRef, amount, message, at]
                      properties:
                        kind:
                          { type: string, enum: [payout_failed, refund_failed, dispute_overdue] }
                        id: { type: string, format: uuid }
                        orderId: { type: [string, 'null'], format: uuid }
                        publicRef: { type: [string, 'null'] }
                        amount: { $ref: '#/components/schemas/Amount' }
                        message: { type: [string, 'null'] }
                        at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error' }

  /v1/admin/reports/activity:
    get:
      tags: [Rapports]
      summary: Activité d'une période — ventes, revenus, catégories, boutiques, reversements (administrateur)
      description: >-
        Ventes : commandes payées dans la période (date du paiement, heure du Congo). Revenus :
        écritures du grand livre de la période ; la commission n'est acquise qu'à la libération du
        séquestre. Reversements et séquestre : état au moment du rapport. Sans période : le mois
        en cours.
      operationId: activityReport
      parameters:
        - {
            name: from,
            in: query,
            schema: { type: string, format: date },
            description: Premier jour (inclus),
          }
        - {
            name: to,
            in: query,
            schema: { type: string, format: date },
            description: 'Dernier jour (inclus), 366 jours au plus',
          }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [period, sales, revenue, daily, categories, topShops, payouts]
                properties:
                  period:
                    type: object
                    required: [from, to, timeZone]
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      timeZone: { type: string, examples: [Africa/Brazzaville] }
                  sales:
                    type: object
                    required:
                      [
                        paidOrders,
                        gmv,
                        itemsSubtotal,
                        deliveryFees,
                        averageBasket,
                        expectedCommission,
                        cancelledOrRefundedOrders,
                        refunds,
                      ]
                    properties:
                      paidOrders: { type: integer }
                      gmv: { $ref: '#/components/schemas/Amount' }
                      itemsSubtotal: { $ref: '#/components/schemas/Amount' }
                      deliveryFees: { $ref: '#/components/schemas/Amount' }
                      averageBasket: { $ref: '#/components/schemas/Amount' }
                      expectedCommission:
                        description: Commission figée sur ces commandes (acquise ou à venir)
                        allOf: [{ $ref: '#/components/schemas/Amount' }]
                      cancelledOrRefundedOrders: { type: integer }
                      refunds:
                        type: object
                        required: [count, amount]
                        properties:
                          count: { type: integer }
                          amount: { $ref: '#/components/schemas/Amount' }
                  revenue:
                    type: object
                    required: [commission, deliveryMargin, paymentFees, net, upcomingCommission]
                    properties:
                      commission: { type: integer }
                      deliveryMargin: { type: integer }
                      paymentFees: { type: integer }
                      net: { type: integer }
                      upcomingCommission:
                        description: Commission des commandes encore au séquestre (état actuel)
                        type: integer
                  daily:
                    type: array
                    items:
                      type: object
                      required: [date, orders, gmv]
                      properties:
                        date: { type: string, format: date }
                        orders: { type: integer }
                        gmv: { type: integer }
                  categories:
                    type: array
                    items:
                      type: object
                      required: [categoryId, name, orders, sales, commission, averageRateBps]
                      properties:
                        categoryId: { type: string, format: uuid }
                        name: { type: string }
                        orders: { type: integer }
                        sales: { type: integer }
                        commission: { type: integer }
                        averageRateBps: { type: integer }
                  topShops:
                    type: array
                    items:
                      type: object
                      required: [sellerId, shopName, orders, sales, commission]
                      properties:
                        sellerId: { type: string, format: uuid }
                        shopName: { type: string }
                        orders: { type: integer }
                        sales: { type: integer }
                        commission: { type: integer }
                  payouts:
                    type: object
                    required: [sent, failed, pending, owedToSellers, inEscrow]
                    properties:
                      sent: { $ref: '#/components/schemas/CountAmount' }
                      failed: { $ref: '#/components/schemas/CountAmount' }
                      pending: { $ref: '#/components/schemas/CountAmount' }
                      owedToSellers: { type: integer }
                      inEscrow: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/admin/reports/orders.csv:
    get:
      tags: [Rapports]
      summary: Commandes payées de la période, en CSV pour le comptable (administrateur, journalisé)
      description: Séparateur « ; », UTF-8 avec BOM, montants en FCFA ; formules de tableur neutralisées.
      operationId: ordersCsv
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Fichier CSV
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/admin/commission-rules:
    get:
      tags: [Rapports]
      summary: Règles de commission, en vigueur, programmées et passées (administrateur)
      operationId: listCommissionRules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CommissionRule' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Rapports]
      summary: Nouvelle règle de commission (administrateur, journalisée)
      description: >-
        Règle permanente : termine celle en vigueur à sa date d'effet. Règle temporaire (validTo) :
        passe devant, la règle habituelle reprend à son expiration. Jamais dans le passé ; les
        commandes déjà passées gardent leur taux.
      operationId: createCommissionRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, rateBps, note]
              properties:
                scope: { type: string, enum: [default, category, seller] }
                categoryId: { type: string, format: uuid }
                sellerId: { type: string, format: uuid }
                rateBps: { type: integer, minimum: 0, maximum: 5000, description: '1 000 = 10 %' }
                validFrom: { type: string, format: date-time, description: Par défaut maintenant }
                validTo: { type: string, format: date-time, description: Offre temporaire }
                note:
                  {
                    type: string,
                    minLength: 3,
                    maxLength: 200,
                    description: Motif (journal d'audit),
                  }
      responses:
        '201':
          description: Créée
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/admin/commission-rules/{id}/end:
    post:
      tags: [Rapports]
      summary: Terminer maintenant une règle de catégorie ou de boutique, ou annuler une règle programmée
      operationId: endCommissionRule
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Terminée (ou annulée si elle n'avait pas commencé) }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/admin/reconciliation/runs:
    get:
      tags: [Rapprochement]
      summary: Contrôles quotidiens, du plus récent au plus ancien (administrateur)
      operationId: listReconciliationRuns
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 366, default: 60 },
          }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, streak, open]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReconciliationRun' }
                  streak:
                    type: integer
                    description: Contrôles de suite sans aucun écart, en partant du plus récent
                  open:
                    description: Écarts encore ouverts (montant = somme des écarts en valeur absolue)
                    $ref: '#/components/schemas/CountAmount'
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Rapprochement]
      summary: Contrôler (ou recontrôler) une journée maintenant (administrateur, journalisé)
      description: >-
        Idempotent : ni écriture ni écart en double. Pour la journée en cours, la période s'arrête
        à l'heure du contrôle ; le contrôle de nuit la reprend en entier. Un relevé indisponible
        donne un contrôle « error », pas une erreur HTTP.
      operationId: runReconciliation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date, description: 'Journée (heure du Congo)' }
                provider: { type: string, description: Par défaut l'agrégateur principal }
      responses:
        '200':
          description: Contrôle terminé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationRun' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/admin/reconciliation/runs/{id}:
    get:
      tags: [Rapprochement]
      summary: Un contrôle et ses écarts (administrateur)
      operationId: getReconciliationRun
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [run, discrepancies]
                properties:
                  run: { $ref: '#/components/schemas/ReconciliationRun' }
                  discrepancies:
                    type: array
                    items: { $ref: '#/components/schemas/Discrepancy' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/admin/reconciliation/discrepancies:
    get:
      tags: [Rapprochement]
      summary: Écarts ouverts (ou tous), les plus récents d'abord (administrateur)
      operationId: listDiscrepancies
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, all], default: open } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Discrepancy' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/admin/reconciliation/discrepancies/{id}/resolve:
    post:
      tags: [Rapprochement]
      summary: Clore un écart, avec au besoin une écriture de régularisation (administrateur, journalisé)
      description: >-
        La régularisation aligne le compte agrégateur du grand livre sur le relevé, pour le montant
        de l'écart. payment_fees = frais de l'agrégateur ; platform_funding = argent versé par
        Zandu (entrée seulement) ; suspense = compte d'attente, le temps de l'enquête. Un écart de
        solde exige une régularisation.
      operationId: resolveDiscrepancy
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  {
                    type: string,
                    minLength: 3,
                    maxLength: 500,
                    description: Explication (journal d'audit),
                  }
                adjustment: { type: string, enum: [payment_fees, platform_funding, suspense] }
      responses:
        '200':
          description: Écart clos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discrepancy' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/admin/staff:
    get:
      tags: [Personnel]
      summary: Membres du personnel (administrateurs d'abord)
      operationId: listStaff
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StaffMember' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Personnel]
      summary: Ajouter un membre du personnel (compte créé au besoin, SMS envoyé, journalisé)
      description: >-
        Les sessions déjà ouvertes par ce numéro sont fermées : la prochaine connexion est une
        session courte du personnel, avec second facteur.
      operationId: addStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, fullName, role]
              properties:
                phone: { type: string, description: 'Numéro congolais (06 123 45 67 ou +242…)' }
                fullName: { type: string, minLength: 2, maxLength: 120 }
                role: { $ref: '#/components/schemas/StaffRole' }
      responses:
        '201':
          description: Ajouté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/admin/staff/{id}:
    get:
      tags: [Personnel]
      summary: Un membre du personnel et ses dernières actions
      operationId: getStaff
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/admin/staff/{id}/role:
    post:
      tags: [Personnel]
      summary: Changer le rôle (sessions fermées, SMS, journalisé)
      description: Jamais sur son propre compte ; Zandu garde toujours un administrateur.
      operationId: changeStaffRole
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/StaffRole' }
      responses:
        '200':
          description: Rôle changé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/admin/staff/{id}/revoke:
    post:
      tags: [Personnel]
      summary: Retirer l'accès au back-office (sessions fermées, second facteur effacé, SMS)
      description: Le compte acheteur ou vendeur de la personne est conservé.
      operationId: revokeStaff
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '204': { description: Accès retiré }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/admin/staff/{id}/sign-out:
    post:
      tags: [Personnel]
      summary: Fermer toutes les sessions d'un membre (l'accès est conservé)
      operationId: signOutStaff
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Sessions fermées
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: integer }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: Jeton opaque obtenu par `POST /v1/auth/otp/verify`

  parameters:
    Period:
      name: period
      in: query
      description: Aujourd'hui, 7 ou 30 derniers jours (jours entiers, heure de Brazzaville)
      schema: { type: string, enum: [today, 7d, 30d], default: today }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }

  requestBodies:
    TotpCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, pattern: '^\d{6}$' }
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string, minLength: 3, maxLength: 300 }

  responses:
    PhotoList:
      description: Photos du produit, dans l'ordre d'affichage
      content:
        application/json:
          schema:
            type: object
            required: [photos]
            properties:
              photos:
                type: array
                items:
                  type: object
                  required: [id, position, url]
                  properties:
                    id: { type: string, format: uuid }
                    position: { type: integer, minimum: 0, maximum: 5 }
                    url: { type: string, format: uri }
    KycStatus:
      description: État du dossier de vérification
      content:
        application/json:
          schema:
            type: object
            required: [verificationStatus, rejectionReason, documents, missing]
            properties:
              verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
              rejectionReason: { type: [string, 'null'] }
              documents:
                type: array
                items:
                  type: object
                  required: [id, type, status, createdAt]
                  properties:
                    id: { type: string, format: uuid }
                    type: { $ref: '#/components/schemas/KycDocumentType' }
                    status: { type: string, enum: [pending, accepted, rejected] }
                    createdAt: { type: string, format: date-time }
              missing:
                type: array
                description: Pièces encore attendues
                items: { $ref: '#/components/schemas/KycDocumentType' }
    Error:
      description: Erreur
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Created:
      description: Créé
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: string, format: uuid }
    Recorded:
      description: Enregistré
      content:
        application/json:
          schema:
            type: object
            required: [recorded]
            properties:
              recorded: { type: boolean, const: true }
    OrderStatusChange:
      description: Nouveau statut
      content:
        application/json:
          schema:
            type: object
            required: [id, status]
            properties:
              id: { type: string, format: uuid }
              status: { $ref: '#/components/schemas/OrderStatus' }
    OrderList:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: '#/components/schemas/Order' }

  schemas:
    SellerStats:
      type: object
      required:
        [
          period,
          views,
          orders,
          sales,
          unitsSold,
          conversionPercent,
          weekly,
          topProducts,
          acceptanceRatePercent,
          averageAcceptMinutes,
          averagePrepMinutes,
          tips,
          counts,
        ]
      properties:
        period: { type: string, enum: [7d, 30d, 90d] }
        views: { type: integer, description: Vues des fiches produits sur la période }
        orders: { type: integer }
        sales: { type: integer, description: Montant des articles vendus (FCFA) }
        unitsSold: { type: integer }
        conversionPercent:
          type: [number, 'null']
          description: Commandes pour 100 vues (null sans vue)
        weekly:
          type: array
          description: 8 dernières semaines (lundi, heure de Brazzaville)
          items:
            type: object
            required: [weekStart, orders, sales]
            properties:
              weekStart: { type: string, format: date }
              orders: { type: integer }
              sales: { type: integer }
        topProducts:
          type: array
          items:
            type: object
            required: [productId, title, views, sold]
            properties:
              productId: { type: string, format: uuid }
              title: { type: string }
              views: { type: integer }
              sold: { type: integer }
        acceptanceRatePercent: { type: [integer, 'null'] }
        averageAcceptMinutes: { type: [integer, 'null'] }
        averagePrepMinutes: { type: [integer, 'null'] }
        tips:
          type: array
          maxItems: 3
          items:
            type: string
            enum: [answer_faster, add_photos, improve_listing, restock, reply_reviews, share_shop]
        counts:
          type: object
          required: [fewPhotos, lowStock, unansweredReviews]
          properties:
            fewPhotos: { type: integer }
            lowStock: { type: integer }
            unansweredReviews: { type: integer }
    RiderReviewTag:
      type: string
      enum: [ponctuel, poli, soigneux, en_retard, impoli, colis_abime]
    RiderRating:
      type: object
      description: Note moyenne des 90 derniers jours
      required: [average, count]
      properties:
        average: { type: [number, 'null'] }
        count: { type: integer }
    Call:
      type: object
      required:
        [id, orderId, publicRef, status, direction, peer, createdAt, answeredAt, ringSeconds]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        publicRef: { type: string }
        status: { type: string, enum: [ringing, accepted, declined, missed, ended] }
        direction: { type: string, enum: [outgoing, incoming] }
        peer: { $ref: '#/components/schemas/ConversationParticipant' }
        createdAt: { type: string, format: date-time }
        answeredAt: { type: [string, 'null'], format: date-time }
        ringSeconds: { type: integer }
    CallWithAccess:
      allOf:
        - $ref: '#/components/schemas/Call'
        - type: object
          required: [livekit]
          properties:
            livekit:
              type: object
              required: [url, token]
              description: Salle de l'appel sur le serveur LiveKit (jeton valable 2 heures)
              properties:
                url: { type: string }
                token: { type: string }
    ConversationRole:
      type: string
      enum: [buyer, seller, rider]
    ConversationParticipant:
      type: object
      required: [role, name]
      properties:
        role: { $ref: '#/components/schemas/ConversationRole' }
        name: { type: string, description: 'Prénom et initiale, ou nom de la boutique' }
    OrderMessageInput:
      type: object
      description: Texte, photo, ou les deux.
      properties:
        body: { type: string, maxLength: 1000 }
        photoUploadId:
          type: string
          format: uuid
          description: Envoi réservé avec l'usage « message_photo »
    SupportMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }
    OrderMessage:
      description: Élément du fil de la conversation, message (texte, photo) ou appel terminé.
      type: object
      required: [id, kind, role, name, mine, body, photoUrl, seen, call, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [message, call] }
        role: { type: string, enum: [buyer, seller, rider, support] }
        name: { type: string }
        mine: { type: boolean }
        body: { type: string }
        photoUrl:
          type: [string, 'null']
          description: Lien de lecture de la photo, valable une heure
        seen:
          type: boolean
          description: Un autre participant a ouvert la conversation après l'envoi (« Vu »)
        call:
          description: Appel (kind = call) — issue et durée
          oneOf:
            - type: 'null'
            - type: object
              required: [status, durationSeconds]
              properties:
                status: { type: string, enum: [declined, missed, ended] }
                durationSeconds: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
    CustomerSummary:
      type: object
      required: [id, name, phone, status, createdAt, orders, paid, disputes]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        phone: { type: string }
        status: { type: string, enum: [active, suspended, closed] }
        createdAt: { type: string, format: date-time }
        city: { type: [string, 'null'] }
        orders: { type: integer }
        paid: { $ref: '#/components/schemas/Amount' }
        disputes: { type: integer }
    PrepMinutes:
      type: integer
      enum: [15, 30, 60, 120]
      description: « Prêt dans 15 min / 30 min / 1 h / 2 h »
    ProductCondition:
      type: string
      enum: [new, refurbished, used]
      description: Neuf, reconditionné, occasion
    DisputeSellerChoice:
      type: string
      enum: [exchange, take_back_refund, contest]
      description: Échanger le produit, reprendre et rembourser, contester avec preuves
    SellerDispute:
      type: object
      required:
        [
          id,
          reason,
          description,
          status,
          resolution,
          slaDueAt,
          sellerChoice,
          sellerMessage,
          sellerRespondedAt,
          buyerName,
          buyerEvidenceCount,
          sellerEvidenceCount,
        ]
      properties:
        id: { type: string, format: uuid }
        reason: { type: string }
        description: { type: string }
        status: { type: string, enum: [open, resolved] }
        resolution: { type: [string, 'null'] }
        slaDueAt: { type: string, format: date-time }
        sellerChoice:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DisputeSellerChoice'
        sellerMessage: { type: [string, 'null'] }
        sellerRespondedAt: { type: [string, 'null'], format: date-time }
        buyerName: { type: string }
        buyerEvidenceCount: { type: integer }
        sellerEvidenceCount: { type: integer }
    SellerShop:
      type: object
      required:
        [
          id,
          shopName,
          slug,
          kind,
          city,
          pickupZoneId,
          pickupZoneName,
          payoutPhone,
          payoutOperator,
          payoutAccountName,
          verificationStatus,
          ratingAvg,
          ratingCount,
          isOpen,
          defaultPrepMinutes,
          openingHours,
          weeklyHours,
          soldCategoryIds,
          termsAccepted,
        ]
      properties:
        id: { type: string, format: uuid }
        shopName: { type: string }
        slug: { type: string }
        kind: { type: string, enum: [individual, business] }
        city: { type: string }
        pickupZoneId: { type: string, format: uuid }
        pickupZoneName: { type: string }
        payoutPhone: { type: string }
        payoutOperator: { $ref: '#/components/schemas/Operator' }
        payoutAccountName: { type: [string, 'null'] }
        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
        ratingAvg: { type: [number, 'null'] }
        ratingCount: { type: integer }
        isOpen: { type: boolean, description: Faux pendant les congés (produits masqués) }
        defaultPrepMinutes: { $ref: '#/components/schemas/PrepMinutes' }
        openingHours: { type: [string, 'null'] }
        weeklyHours:
          oneOf:
            - { $ref: '#/components/schemas/WeeklyHours' }
            - { type: 'null' }
        soldCategoryIds: { type: array, items: { type: string, format: uuid } }
        termsAccepted: { type: boolean }
    SellerReview:
      type: object
      required: [id, rating, comment, tags, createdAt, authorName, productTitle, reply, repliedAt]
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, 'null'] }
        tags: { type: array, items: { $ref: '#/components/schemas/ReviewTag' } }
        createdAt: { type: string, format: date-time }
        authorName: { type: string }
        productTitle: { type: string }
        reply: { type: [string, 'null'] }
        repliedAt: { type: [string, 'null'], format: date-time }
    ReviewTag:
      type: string
      enum: [conforme, livreur_ponctuel, bien_emballe]
      description: "« Conforme à l'annonce », « Livreur ponctuel », « Bien emballé »"
    StaffRole:
      type: string
      enum: [support, admin]
    StaffMember:
      type: object
      required:
        [id, phone, fullName, role, active, mfaEnrolled, lastSeenAt, activeSessions, createdAt]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        fullName: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/StaffRole' }
        active: { type: boolean, description: Compte non suspendu }
        mfaEnrolled: { type: boolean }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        activeSessions: { type: integer }
        createdAt: { type: string, format: date-time }
    StaffDetail:
      allOf:
        - { $ref: '#/components/schemas/StaffMember' }
        - type: object
          required: [recentActions]
          properties:
            recentActions:
              type: array
              description: 30 dernières actions de la personne (journal d'audit)
              items:
                type: object
                required: [action, entityType, entityId, at]
                properties:
                  action: { type: string }
                  entityType: { type: string }
                  entityId: { type: string }
                  at: { type: string, format: date-time }
    ReconciliationRun:
      type: object
      required: [id, provider, date, status, coveredUntil, attempts, startedAt, finishedAt, summary]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        date: { type: string, format: date }
        status:
          description: >-
            balanced = rien à traiter ; discrepancies = écarts ouverts ; error = relevé
            indisponible (nouvelle demande 30 min plus tard) ; running = en cours
          type: string
          enum: [running, balanced, discrepancies, error]
        coveredUntil: { type: [string, 'null'], format: date-time }
        attempts: { type: integer }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        summary: { $ref: '#/components/schemas/ReconciliationSummary' }
    ReconciliationSummary:
      type: object
      required: [period]
      properties:
        period:
          type: object
          required: [from, until]
          properties:
            from: { type: string, format: date-time }
            until: { type: string, format: date-time }
        statement:
          type: object
          required: [lines, collections, payouts, refunds, other, fees]
          properties:
            lines: { type: integer }
            collections: { $ref: '#/components/schemas/CountAmount' }
            payouts: { $ref: '#/components/schemas/CountAmount' }
            refunds: { $ref: '#/components/schemas/CountAmount' }
            other:
              description: Mouvements propres à l'agrégateur (montant signé)
              $ref: '#/components/schemas/CountAmount'
            fees: { type: integer }
        matched: { type: integer, description: Lignes retrouvées à l'identique au grand livre }
        statusesApplied:
          description: Opérations en attente chez Zandu (webhook perdu) conclues d'après le relevé
          $ref: '#/components/schemas/CountAmount'
        feesBooked:
          description: Frais connus par le seul relevé, comptabilisés par le contrôle
          $ref: '#/components/schemas/CountAmount'
        inTransit:
          description: Comptabilisés juste avant la fin de la période, attendus au relevé suivant
          $ref: '#/components/schemas/CountAmount'
        balance:
          description: État de rapprochement ; null si l'agrégateur ne communique pas son solde
          type: [object, 'null']
          required:
            [
              provider,
              ledger,
              laterAdjustments,
              notOnStatement,
              notInLedger,
              amountDifferences,
              unexplained,
            ]
          properties:
            provider: { type: integer, description: Solde annoncé par l'agrégateur }
            ledger: { type: integer, description: Solde du compte agrégateur au grand livre }
            laterAdjustments: { type: integer }
            notOnStatement:
              { type: integer, description: 'Comptabilisé chez Zandu, absent du relevé' }
            notInLedger: { type: integer, description: 'Au relevé, pas comptabilisé chez Zandu' }
            amountDifferences: { type: integer }
            unexplained: { type: integer, description: Doit valoir 0 }
        discrepancies:
          type: object
          required: [found, open, new]
          properties:
            found: { type: integer }
            open: { type: integer }
            new: { type: integer }
        error: { type: string }
    Discrepancy:
      type: object
      required:
        [
          id,
          runId,
          date,
          provider,
          kind,
          operationKind,
          reference,
          providerRef,
          internalAmount,
          providerAmount,
          difference,
          message,
          orderId,
          publicRef,
          createdAt,
          resolution,
        ]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        date: { type: string, format: date }
        provider: { type: string }
        kind:
          type: string
          enum:
            [
              missing_internal,
              missing_provider,
              amount_mismatch,
              status_mismatch,
              fee_mismatch,
              balance_mismatch,
            ]
        operationKind: { type: string, enum: [collection, payout, refund, other, fee, balance] }
        reference: { type: string }
        providerRef: { type: [string, 'null'] }
        internalAmount: { type: integer, description: Effet sur le solde selon Zandu }
        providerAmount: { type: integer, description: Effet sur le solde selon l'agrégateur }
        difference: { type: integer, description: "À régulariser : + l'agrégateur détient plus" }
        message: { type: string }
        orderId: { type: [string, 'null'], format: uuid }
        publicRef: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        resolution:
          type: [object, 'null']
          required: [at, by, note, automatic, adjustment]
          properties:
            at: { type: string, format: date-time }
            by: { type: [string, 'null'], description: Téléphone de l'administrateur }
            note: { type: string }
            automatic: { type: boolean }
            adjustment:
              type: [object, 'null']
              required: [counterpart, amount]
              properties:
                counterpart: { type: string, enum: [payment_fees, platform_funding, suspense] }
                amount: { type: integer }
    CountAmount:
      type: object
      required: [count, amount]
      properties:
        count: { type: integer }
        amount: { type: integer }
    CommissionRule:
      type: object
      required:
        [
          id,
          scope,
          categoryId,
          categoryName,
          sellerId,
          shopName,
          rateBps,
          validFrom,
          validTo,
          note,
          createdAt,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [default, category, seller] }
        categoryId: { type: [string, 'null'], format: uuid }
        categoryName: { type: [string, 'null'] }
        sellerId: { type: [string, 'null'], format: uuid }
        shopName: { type: [string, 'null'] }
        rateBps: { type: integer }
        validFrom: { type: string, format: date-time }
        validTo: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        status:
          description: >-
            active = s'applique ; overridden = en vigueur mais une offre temporaire passe devant ;
            scheduled = programmée ; ended = terminée
          type: string
          enum: [active, overridden, scheduled, ended]
    VerificationStatus:
      type: string
      enum: [unverified, pending_review, verified, rejected, suspended]
    ProductStatus:
      type: string
      enum: [draft, pending_review, published, rejected, archived]
    KycDocumentType:
      type: string
      enum: [national_id, passport, residence_proof, selfie, rccm, niu]
    Amount:
      type: integer
      minimum: 0
      description: Montant en francs CFA (XAF), entier
      examples: [25000]
    Operator:
      type: string
      enum: [mtn, airtel]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [out_of_stock] }
            message: { type: string }
            details: { type: object }
    User:
      type: object
      required: [id, phone, fullName, roles]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, examples: ['+242066123456'] }
        fullName: { type: [string, 'null'] }
        roles:
          type: array
          items: { type: string, enum: [buyer, seller, rider, support, admin] }
    ProductCard:
      type: object
      required:
        [id, title, price, compareAtPrice, stock, city, categoryId, condition, coverImage, seller]
      properties:
        id: { type: string, format: uuid }
        condition: { $ref: '#/components/schemas/ProductCondition' }
        title: { type: string }
        price: { $ref: '#/components/schemas/Amount' }
        compareAtPrice: { type: [integer, 'null'] }
        stock: { type: integer }
        city: { type: string }
        categoryId: { type: string, format: uuid }
        coverImage:
          description: Vignette de la première photo (320 px au plus, WebP), ou l'original en attendant.
          type: [string, 'null']
        seller:
          type: object
          properties:
            id: { type: string, format: uuid }
            shopName: { type: string }
            slug: { type: string }
            verified: { type: boolean }
            open:
              { type: boolean, description: Faux si la boutique est en congé (achat impossible) }
            ratingAvg: { type: [number, 'null'] }
            ratingCount: { type: integer }
          required: [id, shopName, slug, verified, open, ratingAvg, ratingCount]
    OrderStatus:
      type: string
      enum:
        [
          pending_payment,
          paid,
          preparing,
          ready_for_pickup,
          in_delivery,
          awaiting_collection,
          delivered,
          completed,
          disputed,
          refunded,
          cancelled,
        ]
    ShippingAddress:
      type: object
      required: [recipientName, phone, landmark]
      properties:
        recipientName: { type: string }
        phone: { type: string }
        landmark: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90, examples: [-4.7612] }
        lng: { type: number, minimum: -180, maximum: 180, examples: [11.8735] }
        accuracy: { type: number, description: Précision en mètres }
    DisputeReason:
      type: string
      enum: [not_received, not_as_described, damaged, counterfeit, missing_items, other]
    SupportOrder:
      description: Commande vue par le support, avec tout le circuit de l'argent.
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [history, buyer, sellerContact, payments, refunds, payouts, delivery, dispute]
          properties:
            history: { $ref: '#/components/schemas/OrderHistory' }
            buyer:
              type: object
              required: [id, phone, name]
              properties:
                id: { type: string, format: uuid }
                phone: { type: string }
                name: { type: [string, 'null'] }
            sellerContact:
              type: object
              required: [phone, verificationStatus]
              properties:
                phone: { type: string }
                verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
            payments:
              type: array
              description: Tentatives de paiement du panier (qui peut couvrir plusieurs boutiques)
              items:
                type: object
                required:
                  [
                    id,
                    status,
                    operator,
                    msisdn,
                    amount,
                    provider,
                    lateSuccess,
                    failureCode,
                    failureMessage,
                    createdAt,
                    succeededAt,
                  ]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [created, pending, succeeded, failed, expired] }
                  operator: { $ref: '#/components/schemas/Operator' }
                  msisdn: { type: string }
                  amount: { $ref: '#/components/schemas/Amount' }
                  provider: { type: string }
                  lateSuccess: { type: boolean }
                  failureCode: { type: [string, 'null'] }
                  failureMessage: { type: [string, 'null'] }
                  createdAt: { type: string, format: date-time }
                  succeededAt: { type: [string, 'null'], format: date-time }
            refunds:
              type: array
              items:
                type: object
                required: [id, amount, status, reason, lastError, createdAt, succeededAt]
                properties:
                  id: { type: string, format: uuid }
                  amount: { $ref: '#/components/schemas/Amount' }
                  status: { type: string, enum: [pending, processing, succeeded, failed] }
                  reason: { type: string }
                  lastError: { type: [string, 'null'] }
                  createdAt: { type: string, format: date-time }
                  succeededAt: { type: [string, 'null'], format: date-time }
            payouts:
              type: array
              items:
                type: object
                required:
                  [
                    id,
                    amount,
                    status,
                    operator,
                    msisdn,
                    attempts,
                    lastError,
                    createdAt,
                    succeededAt,
                  ]
                properties:
                  id: { type: string, format: uuid }
                  amount: { $ref: '#/components/schemas/Amount' }
                  status: { type: string, enum: [pending, processing, succeeded, failed] }
                  operator: { $ref: '#/components/schemas/Operator' }
                  msisdn: { type: string }
                  attempts: { type: integer }
                  lastError: { type: [string, 'null'] }
                  createdAt: { type: string, format: date-time }
                  succeededAt: { type: [string, 'null'], format: date-time }
            delivery:
              type: [object, 'null']
              required:
                [
                  status,
                  handoverAttempts,
                  assignedAt,
                  pickedUpAt,
                  deliveredAt,
                  failureReason,
                  riderPhone,
                  riderName,
                ]
              properties:
                status:
                  type: string
                  enum:
                    [
                      awaiting_assignment,
                      assigned,
                      picked_up,
                      at_pickup_point,
                      delivered,
                      failed,
                      cancelled,
                    ]
                handoverAttempts: { type: integer }
                assignedAt: { type: [string, 'null'], format: date-time }
                pickedUpAt: { type: [string, 'null'], format: date-time }
                deliveredAt: { type: [string, 'null'], format: date-time }
                failureReason: { type: [string, 'null'] }
                riderPhone: { type: [string, 'null'] }
                riderName: { type: [string, 'null'] }
            dispute:
              type: [object, 'null']
              required: [id, status, reason, resolution, refundAmount, slaDueAt, createdAt]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [open, resolved] }
                reason: { $ref: '#/components/schemas/DisputeReason' }
                resolution: { type: [string, 'null'] }
                refundAmount: { type: [integer, 'null'] }
                slaDueAt: { type: string, format: date-time }
                createdAt: { type: string, format: date-time }
    OrderHistory:
      type: array
      items:
        type: object
        required: [status, event, at]
        properties:
          status: { $ref: '#/components/schemas/OrderStatus' }
          event: { type: string }
          at: { type: string, format: date-time }
    SellerOrder:
      description: Commande vue par le vendeur, sans les coordonnées de l'acheteur.
      allOf:
        - $ref: '#/components/schemas/OrderCore'
        - type: object
          required: [commission, sellerNet, destination, readyPromisedAt]
          properties:
            readyPromisedAt:
              type: [string, 'null']
              format: date-time
              description: Heure promise à l'acceptation (« Prêt dans 30 min »)
            commission: { $ref: '#/components/schemas/Amount' }
            sellerNet:
              allOf: [{ $ref: '#/components/schemas/Amount' }]
              description: Ce que le vendeur recevra (articles − commission)
            destination:
              type: object
              required: [city, zone, pickupPoint]
              properties:
                city: { type: string }
                zone: { type: string }
                pickupPoint: { type: [string, 'null'] }
    SellerProduct:
      type: object
      required:
        [
          id,
          title,
          description,
          price,
          stock,
          status,
          categoryId,
          condition,
          lowStockThreshold,
          rejectionReason,
          updatedAt,
          photos,
          compareAtPrice,
          saleEndsAt,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        compareAtPrice:
          type: [integer, 'null']
          description: Ancien prix pendant une promotion (prix barré)
        saleEndsAt: { type: [string, 'null'], format: date-time }
        price: { $ref: '#/components/schemas/Amount' }
        stock: { type: integer }
        status: { $ref: '#/components/schemas/ProductStatus' }
        categoryId: { type: string, format: uuid }
        condition: { $ref: '#/components/schemas/ProductCondition' }
        lowStockThreshold: { type: integer }
        rejectionReason: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
        photos:
          type: array
          items:
            type: object
            required: [id, position, url]
            properties:
              id: { type: string, format: uuid }
              position: { type: integer, minimum: 0, maximum: 5 }
              url: { type: string, format: uri }
    RiderMission:
      description: "Mission de livraison. Commande déjà payée : le livreur n'encaisse jamais d'argent."
      type: object
      required:
        [
          orderId,
          status,
          orderStatus,
          publicRef,
          deliveryMode,
          recipient,
          pickup,
          destination,
          itemCount,
          handoverAttemptsLeft,
          assignedAt,
          pickedUpAt,
          items,
          pickupCode,
          pickupConfirmedAt,
          arrivedAt,
          absentAllowedAt,
          returnCode,
          returnConfirmedAt,
          deliveredAt,
          returnedAt,
          failureReason,
          contacts,
        ]
      properties:
        orderId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        orderStatus: { $ref: '#/components/schemas/OrderStatus' }
        publicRef: { type: string }
        deliveryMode: { type: string, enum: [home, pickup_point] }
        recipient: { $ref: '#/components/schemas/ShippingAddress' }
        pickup:
          type: object
          required: [shopName, phone, city, zone]
          properties:
            shopName: { type: string }
            phone: { type: string }
            city: { type: string }
            zone: { type: string }
        destination:
          type: object
          required: [city, zone, pickupPoint, location]
          properties:
            city: { type: string }
            zone: { type: string }
            location:
              description: Repère GPS du client ou coordonnées du point relais, s'ils sont connus
              oneOf: [{ $ref: '#/components/schemas/GeoPoint' }, { type: 'null' }]
            pickupPoint:
              type: [object, 'null']
              required: [name, landmark]
              properties:
                name: { type: string }
                landmark: { type: string }
        itemCount: { type: integer }
        handoverAttemptsLeft: { type: integer, minimum: 0 }
        assignedAt: { type: [string, 'null'], format: date-time }
        pickedUpAt: { type: [string, 'null'], format: date-time }
        items:
          type: array
          description: Ce que le livreur vérifie avant de prendre le colis
          items:
            type: object
            required: [title, quantity]
            properties:
              title: { type: string }
              quantity: { type: integer }
        pickupCode:
          type: [string, 'null']
          pattern: '^\d{4}$'
          description: Code de retrait à montrer au vendeur (tant que le colis n'est pas pris)
        pickupConfirmedAt: { type: [string, 'null'], format: date-time }
        arrivedAt:
          type: [string, 'null']
          format: date-time
          description: Arrivée chez le client (livraison à domicile)
        absentAllowedAt:
          type: [string, 'null']
          format: date-time
          description: À partir de quand le client peut être déclaré absent
        returnCode:
          type: [string, 'null']
          pattern: '^\d{4}$'
          description: Code de retour à montrer au vendeur (colis rapporté)
        returnConfirmedAt: { type: [string, 'null'], format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
        returnedAt: { type: [string, 'null'], format: date-time }
        failureReason: { type: [string, 'null'] }
        contacts:
          type: array
          description: Tentatives de contact pendant l'attente (appels du livreur, SMS automatique)
          items:
            type: object
            required: [kind, at]
            properties:
              kind: { type: string, enum: [call, sms] }
              at: { type: string, format: date-time }
    PayoutStatus:
      type: string
      enum: [awaiting_review, pending, processing, succeeded, failed]
    WeeklyHours:
      description: 7 jours, lundi d'abord ; null = fermé ce jour-là. Heure de Brazzaville.
      type: array
      minItems: 7
      maxItems: 7
      items:
        oneOf:
          - type: object
            required: [open, close]
            properties:
              open: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', examples: ['08:00'] }
              close: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', examples: ['18:00'] }
          - type: 'null'
    PlatformSettings:
      type: object
      required: [money, delays]
      properties:
        money:
          type: object
          required:
            [
              defaultCommissionBps,
              deliveryRates,
              newSellerPayoutCap,
              payoutMode,
              withdrawalReviewAmount,
            ]
          properties:
            defaultCommissionBps: { type: [integer, 'null'] }
            deliveryRates:
              type: array
              items:
                type: object
                required: [city, mode, min, max]
                properties:
                  city: { type: string }
                  mode: { type: string, enum: [home, pickup_point] }
                  min: { $ref: '#/components/schemas/Amount' }
                  max: { $ref: '#/components/schemas/Amount' }
            newSellerPayoutCap: { $ref: '#/components/schemas/Amount' }
            payoutMode: { type: string, enum: [automatic, on_demand] }
            withdrawalReviewAmount: { $ref: '#/components/schemas/Amount' }
        delays:
          type: object
          required:
            [
              sellerAcceptanceHours,
              sellerAcceptance,
              disputeWindowHours,
              disputeSlaHours,
              pushFallbackMinutes,
            ]
          properties:
            sellerAcceptanceHours: { type: number }
            sellerAcceptance:
              type: object
              required: [minutes, openHoursOnly, source, updatedAt, updatedBy, choices]
              properties:
                minutes: { type: integer }
                openHoursOnly:
                  type: boolean
                  description: Le délai ne compte que les heures d'ouverture des boutiques qui les ont renseignées
                source:
                  type: string
                  enum: [default, custom]
                  description: '`default` : SELLER_ACCEPT_HOURS ; `custom` : réglé dans le back-office'
                updatedAt: { type: [string, 'null'], format: date-time }
                updatedBy: { type: [string, 'null'] }
                choices: { type: array, items: { type: integer } }
            disputeWindowHours: { type: number }
            disputeSlaHours: { type: number }
            pushFallbackMinutes: { type: number }
    DeliveryStatus:
      type: string
      enum:
        [
          awaiting_assignment,
          assigned,
          picked_up,
          at_pickup_point,
          returning,
          delivered,
          failed,
          cancelled,
        ]
    DeliveryIncident:
      type: string
      enum: [breakdown, accident, not_ready, damaged, other]
    Code4:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^\d{4}$' }
    OrderCore:
      description: Champs communs aux vues acheteur et vendeur d'une commande.
      type: object
      required:
        [
          id,
          publicRef,
          checkoutId,
          status,
          seller,
          items,
          itemsSubtotal,
          deliveryFee,
          total,
          refundedAmount,
          currency,
          deliveryMode,
          sellerAcceptDeadline,
          disputeWindowEndsAt,
          createdAt,
          paidAt,
          deliveredAt,
          completedAt,
          cancelledAt,
          cancelReason,
          discountTotal,
          couponCode,
        ]
      properties:
        id: { type: string, format: uuid }
        publicRef: { type: string, examples: [ZD-7K3M9Q2P] }
        checkoutId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        seller:
          type: object
          required: [id, shopName]
          properties:
            id: { type: string, format: uuid }
            shopName: { type: string }
        items:
          type: array
          items:
            type: object
            required: [itemId, productId, title, unitPrice, quantity, lineTotal, reviewed]
            properties:
              itemId: { type: string, format: uuid, description: À utiliser pour noter l'article }
              productId: { type: string, format: uuid }
              title: { type: string }
              unitPrice: { $ref: '#/components/schemas/Amount' }
              quantity: { type: integer }
              lineTotal: { $ref: '#/components/schemas/Amount' }
              reviewed: { type: boolean }
        itemsSubtotal: { $ref: '#/components/schemas/Amount' }
        deliveryFee: { $ref: '#/components/schemas/Amount' }
        total: { $ref: '#/components/schemas/Amount' }
        refundedAmount: { $ref: '#/components/schemas/Amount' }
        currency: { type: string, const: XAF }
        deliveryMode: { type: string, enum: [home, pickup_point] }
        sellerAcceptDeadline: { type: [string, 'null'], format: date-time }
        disputeWindowEndsAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancelReason: { type: [string, 'null'] }
        discountTotal:
          $ref: '#/components/schemas/Amount'
          description: Remise du code promo de la boutique, déjà déduite de itemsSubtotal
        couponCode: { type: [string, 'null'] }
    Order:
      description: Commande vue par l'acheteur (et le support), coordonnées de livraison comprises.
      allOf:
        - $ref: '#/components/schemas/OrderCore'
        - type: object
          required: [shippingAddress]
          properties:
            shippingAddress: { $ref: '#/components/schemas/ShippingAddress' }
    Checkout:
      type: object
      required:
        [id, status, itemsTotal, deliveryTotal, grandTotal, currency, expiresAt, paidAt, orders]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [awaiting_payment, paid, expired] }
        itemsTotal: { $ref: '#/components/schemas/Amount' }
        deliveryTotal: { $ref: '#/components/schemas/Amount' }
        grandTotal: { $ref: '#/components/schemas/Amount' }
        currency: { type: string, const: XAF }
        expiresAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
        orders:
          type: array
          items: { $ref: '#/components/schemas/Order' }
    Payment:
      type: object
      required:
        [
          id,
          checkoutId,
          status,
          operator,
          msisdn,
          amount,
          currency,
          expiresAt,
          lateSuccess,
          failure,
        ]
      properties:
        id: { type: string, format: uuid }
        checkoutId: { type: string, format: uuid }
        status: { type: string, enum: [created, pending, succeeded, failed, expired] }
        operator: { $ref: '#/components/schemas/Operator' }
        msisdn: { type: string, examples: ['+242066123456'] }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { type: string, const: XAF }
        expiresAt: { type: string, format: date-time }
        lateSuccess:
          type: boolean
          description: Succès reçu après expiration — remboursé automatiquement
        failure:
          type: [object, 'null']
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  insufficient_funds,
                  declined,
                  invalid_account,
                  limit_exceeded,
                  expired,
                  not_submitted,
                  failed,
                ]
            message: { type: string, description: Message prêt à afficher à l'acheteur }
