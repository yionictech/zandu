# Environnement de développement local : `docker compose up -d` puis voir README.md.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zandu
      POSTGRES_PASSWORD: zandu
      POSTGRES_DB: zandu
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zandu']
      interval: 5s
      retries: 10

  # Stockage objet compatible S3, facultatif (STORAGE_DRIVER=s3) : le même que la recette.
  # Clés de développement : zandudev / zandudevsecret (voir .env.example).
  stockage:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ['/bin/sh', '/opt/zandu/demarrer.sh']
    environment:
      S3_ACCESS_KEY_ID: zandudev
      S3_SECRET_ACCESS_KEY: zandudevsecret
    ports: ['8333:8333']
    volumes:
      - ./deploy/recette/stockage/demarrer.sh:/opt/zandu/demarrer.sh:ro
      - stockage:/data

volumes:
  pgdata:
  stockage:
